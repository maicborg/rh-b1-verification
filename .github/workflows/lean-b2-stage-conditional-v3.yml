name: "B2 - recompilation meanSqK StagePow under conditional QRH"
on:
  push:
    paths:
      - '.github/workflows/lean-b2-stage-conditional-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stages:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout proof sources
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout original Alpoge pinned
        uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Install elan
        working-directory: alpoge
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Copy isolated new modules
        run: |
          mkdir -p alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds
          for f in B2NoExceptional B2JacobiClassZero B2IntegratedBridge B2JacobiRelativeActual B2PrimeSetOneEndpoint B2SmallErrorBudget B2CountRelativeActualV3 B2AdmittedLogModulusV3 B2PNTThresholdFromBudget B2UniformPNTFromAdmittedV4 B2JacobiEnvelopeV3 B2ExponentFromAdmittedV4 B2LowEndpointDecayV2 B2TwistKNoExceptionConditionalV3; do
            cp bridge/$f.lean alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds/
          done
      - name: Patch only ephemeral checkout to use h78-conditional B2 lemma
        working-directory: alpoge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path("src/Development/AutomorphicArithmetic/MeanSquareBounds")
          m=base/"meanSqK.lean"
          t=m.read_text()
          old="import Development.AutomorphicArithmetic.MeanSquareBounds.twistK"
          new="import Development.AutomorphicArithmetic.MeanSquareBounds.B2TwistKNoExceptionConditionalV3"
          assert t.count(old)==1
          t=t.replace(old,new,1)
          old="theorem meanSqK :"
          h78="(h78 : ∀ (M : ℕ) [NeZero M] (χ : DirichletCharacter ℂ M) (β : ℝ), χ ≠ 1 → (7 / 8 : ℝ) < β → DirichletCharacter.LFunction χ (β : ℂ) ≠ 0)"
          assert t.count(old)==1
          t=t.replace(old,"theorem meanSqK "+h78+" :",1)
          old=":= twistK ε (800 * K) (K + 1)"
          assert t.count(old)==1
          t=t.replace(old,":= b2_twistK_no_exception_of_seven_eighths_v3 h78 ε (800 * K) (K + 1)",1)
          m.write_text(t+"\n#print axioms QH.meanSqK\n")
          p=base/"StagePow.lean"
          t=p.read_text()
          old="theorem stage :"
          assert t.count(old)==1
          t=t.replace(old,"theorem stage "+h78+" :",1)
          old="obtain ⟨Cm, hCm, hms⟩ := meanSqK"
          assert t.count(old)==1
          t=t.replace(old,"obtain ⟨Cm, hCm, hms⟩ := meanSqK h78",1)
          p.write_text(t+"\n#print axioms QH.stage\n")
          print("Patched ephemeral meanSqK and StagePow, no upstream commit")
          PY
      - name: Resolve pinned dependencies
        working-directory: alpoge
        run: |
          lake update
          lake exe cache get
      - name: Restore pinned cache
        uses: actions/cache/restore@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpoge-b2-0df444-${{ runner.os }}-
      - name: Kernel-build replacement mean-square and StagePow
        working-directory: alpoge
        timeout-minutes: 290
        run: lake build Development.AutomorphicArithmetic.MeanSquareBounds.StagePow
      - name: Audit StagePow and meanSq axioms
        working-directory: alpoge
        run: |
          set -o pipefail
          lake env lean src/Development/AutomorphicArithmetic/MeanSquareBounds/StagePow.lean 2>&1 | tee /tmp/b2-stage-axioms.log
          lake env lean src/Development/AutomorphicArithmetic/MeanSquareBounds/meanSqK.lean 2>&1 | tee /tmp/b2-ms-axioms.log
          if grep -E '^ *sorryAx' /tmp/b2-stage-axioms.log /tmp/b2-ms-axioms.log; then exit 1; fi
      - name: Save pinned cache
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
