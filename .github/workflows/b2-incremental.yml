name: "B2 | Incremental Lean verification"
on:
  push:
    branches:
      - b2/incremental-ci
    paths:
      - ".github/workflows/b2-incremental.yml"
      - "ci/b2_prepare.py"
      - "B2*.lean"
  workflow_dispatch:
    inputs:
      phase:
        description: "Last phase to execute"
        required: true
        default: full
        type: choice
        options:
          - preflight
          - compat
          - pnt
          - full
permissions:
  contents: read
concurrency:
  group: b2-incremental-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: "0 | source patch preflight (no Lean)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout pinned Alpoge sources
        uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            src
      - name: Compile patch script and verify every source match and bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge/b2-logs
          python3 -m py_compile bridge/ci/b2_prepare.py
          python3 bridge/ci/b2_prepare.py --root alpoge/src --bridge bridge --mode check 2>&1 | tee bridge/b2-logs/preflight.log
      - name: Save preflight diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-preflight-${{ github.run_id }}
          path: bridge/b2-logs/
          if-no-files-found: ignore
          retention-days: 14
  build:
    name: "1 | compat -> PNT -> real OAI 7/8 -> twistK -> StagePow"
    needs: preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.phase != 'preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout pinned OpenAI original project (Lean 4.34.1)
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 4eaee87548250b2682affda7d05d947c05554bae
          path: upstream
          filter: blob:none
          sparse-checkout: |
            lean
      - name: Checkout pinned Alpoge sources
        uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            src
      - name: Assemble disposable unified source tree
        shell: bash
        run: |
          set -euo pipefail
          for folder in BuildAid CompanionTheory Development Formalism GroundTheory Lemmata PositivityTheory ReciprocityTheory Supplements; do
            cp -a "alpoge/src/$folder" "upstream/lean/$folder"
          done
          cat >> upstream/lean/lakefile.lean <<'EOF'
          lean_lib BuildAid where globs := #[`BuildAid.+]
          lean_lib CompanionTheory where globs := #[`CompanionTheory.+]
          lean_lib Development where globs := #[`Development.+]
          lean_lib Formalism where globs := #[`Formalism.+]
          lean_lib GroundTheory where globs := #[`GroundTheory.+]
          lean_lib Lemmata where globs := #[`Lemmata.+]
          lean_lib PositivityTheory where globs := #[`PositivityTheory.+]
          lean_lib ReciprocityTheory where globs := #[`ReciprocityTheory.+]
          lean_lib Supplements where globs := #[`Supplements.+]
          EOF
          mkdir -p upstream/lean/Development/AutomorphicArithmetic/MeanSquareBounds
          for f in B2NoExceptional B2JacobiClassZero B2IntegratedBridge B2JacobiRelativeActual B2PrimeSetOneEndpoint B2SmallErrorBudget B2CountNoExceptionV1 B2CountRelativeActualV3 B2AdmittedLogModulusV3 B2PNTThresholdFromBudget B2UniformPNTFromAdmittedV4 B2JacobiEnvelopeV3 B2ExponentFromAdmittedV4 B2LowEndpointDecayV2 B2TwistKNoExceptionConditionalV5 B2TwistKAllOddV6 B2JacobiPairCorrelationV1 B2IntervalSecondMomentV1 B2IntervalPrimepowersBudgetV1 B2IntervalLocalEnergyV1 B2NoExceptionalLocalL2V1 B2RealPNT; do
            cp "bridge/$f.lean" upstream/lean/Development/AutomorphicArithmetic/MeanSquareBounds/
          done
          python3 bridge/ci/b2_prepare.py --root upstream/lean --bridge bridge --mode apply
          mkdir -p bridge/b2-logs
      - name: Install Lean via elan
        working-directory: upstream/lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies and Mathlib cache
        working-directory: upstream/lean
        timeout-minutes: 65
        run: |
          lake update
          lake exe cache get
      - name: Restore prior B2 incremental .olean cache
        uses: actions/cache/restore@v4
        with:
          path: |
            upstream/lean/.lake/build
          key: b2-incremental-lean4341-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            b2-incremental-lean4341-${{ runner.os }}-
      - name: "1 | Compile changed compatibility modules FIRST"
        working-directory: upstream/lean
        timeout-minutes: 230
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.PNTDHLocalA \
            Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.PNTExplLoc \
            Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.PNTExplLF \
            Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.SecondBlockCount \
            Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.ZeroCountFirst \
            Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.MSqTwistB \
            Formalism.LFunctionBounds.LFunctionBoundsProofs.DivisorBound \
            2>&1 | tee ../../bridge/b2-logs/compat.log
      - name: "2 | Compile original Alpoge PNTFinal"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.phase == 'full' || inputs.phase == 'pnt' }}
        working-directory: upstream/lean
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          lake build Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.PNTFinal 2>&1 | tee ../../bridge/b2-logs/pnt.log
      - name: "3 | Build real OpenAI 7/8 + Alpoge PNT kernel bridge"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.phase == 'full' || inputs.phase == 'pnt' }}
        working-directory: upstream/lean
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          lake build Development.AutomorphicArithmetic.MeanSquareBounds.B2RealPNT 2>&1 | tee ../../bridge/b2-logs/real-pnt.log
      - name: "4 | Compile conditional replacement discharged with actual OpenAI theorem"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.phase == 'full' }}
        working-directory: upstream/lean
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          lake build Development.AutomorphicArithmetic.MeanSquareBounds.B2TwistKNoExceptionConditionalV5 \
            Development.AutomorphicArithmetic.MeanSquareBounds.B2TwistKAllOddV6 \
            Development.AutomorphicArithmetic.MeanSquareBounds.B2JacobiPairCorrelationV1 \
            Development.AutomorphicArithmetic.MeanSquareBounds.B2IntervalSecondMomentV1 \
            Development.AutomorphicArithmetic.MeanSquareBounds.B2IntervalPrimepowersBudgetV1 \
            Development.AutomorphicArithmetic.MeanSquareBounds.B2IntervalLocalEnergyV1 \
            Development.AutomorphicArithmetic.MeanSquareBounds.B2NoExceptionalLocalL2V1 \
            Development.AutomorphicArithmetic.MeanSquareBounds.meanSqK \
            Development.AutomorphicArithmetic.MeanSquareBounds.StagePow 2>&1 | tee ../../bridge/b2-logs/stagepow.log
      - name: "5 | Check real theorem axioms; reject sorryAx"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.phase == 'full' }}
        working-directory: upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          for file in B2RealPNT B2CountNoExceptionV1 B2CountRelativeActualV3 B2TwistKNoExceptionConditionalV5 B2TwistKAllOddV6 B2JacobiPairCorrelationV1 B2IntervalSecondMomentV1 B2IntervalPrimepowersBudgetV1 B2IntervalLocalEnergyV1 B2NoExceptionalLocalL2V1 meanSqK StagePow; do
            lake env lean Development/AutomorphicArithmetic/MeanSquareBounds/$file.lean \
              2>&1 | tee "../../bridge/b2-logs/axioms-$file.log"
            if grep -q sorryAx "../../bridge/b2-logs/axioms-$file.log"; then
              echo "UNCERTIFIED: sorryAx in $file" >&2
              exit 1
            fi
          done
      - name: Save incremental compilation cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            upstream/lean/.lake/build
          key: b2-incremental-lean4341-${{ runner.os }}-${{ github.run_id }}
      - name: Preserve logs even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-build-${{ github.run_id }}
          path: bridge/b2-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize verification gate
        if: always()
        shell: bash
        run: |
          echo "B2 incremental verified steps are authoritative, not the run name." >> "$GITHUB_STEP_SUMMARY"
          echo "Original OpenAI and Alpoge repos unchanged. No RH or GRH claim." >> "$GITHUB_STEP_SUMMARY"
