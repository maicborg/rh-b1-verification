      - name: Microtest growth
        id: growth
        continue-on-error: true
        working-directory: upstream/lean
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFH_growth.lean <<'LEAN'
          import RFHMatchedBase
          open Finset UpperTheory.Top Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          theorem growth_of_index_one {H : Type} [AddCommGroup H] [Fintype H] [DecidableEq H]
              (A0 : AddSubgroup H) (hi : A0.index = 1)
              (D : ArithData H) (ell : AddChar (E0 × H) ℂ → ℂ)
              (N m : ℕ) (TT T2 : Finset H) (a : H → ℝ) (w : H → Fin m → E0 × H → ℝ)
              (x eps b b' η X' θ Cd CL : ℝ)
              (hx : 3 ≤ x) (hb : 0 < b) (hc : 0 ≤ Cd)
              (hSz : SizesA A0 TT T2 a w N x b b' η X' θ)
              (hThin : ThinScales D ell X' θ) (hDer : DerivInt D ell Cd)
              (hVal : ValuesAtX D ell x eps CL) :
              GrowthInequalityHypotheses D ell N TT T2 a w x eps b b' η X' θ Cd CL
                (topExcess D N ell TT a w) := by
            have ht : A0 = ⊤ := AddSubgroup.index_eq_one.mp hi
            have ha0 : ∀ u : H, u ∈ A0 := by intro u; rw [ht]; trivial
            obtain ⟨hη,hXp,hbp,hbX,hθ,ha,hp,hth,hthin,hN⟩ := hSz
            exact ⟨hx,hb,hη,hXp,hbp,hbX,hθ,hc,ha,
              ⟨fun u j ρ hρ => hp u (ha0 u) j ρ hρ,
                fun u j ρ hρ => hth u (ha0 u) j ρ hρ,
                fun u j ρ hρ hn => hthin u (ha0 u) j ρ hρ hn⟩,
              fun u j t ρ hT hρ => hN u (ha0 u) j t ρ hT hρ,
              le_rfl,hThin,lipschitz_weight_all H D ell,hDer,hVal⟩
          
          
          end BorghettiRH
          #print axioms BorghettiRH.growth_of_index_one
          LEAN
          lake env lean -o RFH_growth.olean RFH_growth.lean 2>&1 | tee ../../bridge/assembly-logs/growth.log
      - name: Microtest rest
        id: rest
        continue-on-error: true
        working-directory: upstream/lean
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFH_rest.lean <<'LEAN'
          import RFHMatchedBase
          open Finset UpperTheory.Top Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          set_option maxHeartbeats 2000000 in
          theorem size_of_rest_and_error
              {H : Type} [AddCommGroup H] [Fintype H] [DecidableEq H]
              {U : Type} [Fintype U] {W : U → Type} [∀ u, Fintype (W u)] [∀ u, Nonempty (W u)]
              {Top : Type} [Fintype Top] {m f : ℕ}
              (Dd : Data U W Top m f) (C : Consts) (Xpp eK K E : ℝ) (TT T2 : Finset H)
              (hWin : ErrWindows Dd C Xpp eK K)
              (hRest : RestSize Dd.ε Dd.x (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a)
              (hE : E ≤ Dd.x ^ (CErr C * Dd.ε) *
                errorBracketSizeWindows Dd.x Dd.ε (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a)
              (h3 : 3 ≤ Dd.x) (h26 : 26 ≤ Dd.x ^ (3 * Dd.ε / 8)) :
              SizeWindows (CErr C) Dd.ε Dd.x (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a E := by
            have hh := hWin
            unfold ErrWindows ErrWindows0 ConstsBound at hh
            have he : 0 < Dd.ε := by tauto
            have hb1 : 1 ≤ Dd.b := by tauto
            have ha : Dd.x * Dd.b ≤ Dd.a := by tauto
            have hmU : (m : ℝ) ≤ Dd.x ^ ((1 : ℝ) / 2 + Dd.ε / 2) := by tauto
            have hkL : Dd.x * m ≤ Dd.k := by tauto
            have hcD : 0 ≤ C.eDiv := by tauto
            have hcL : 0 ≤ C.eLoss := by tauto
            have hC : 0 ≤ CErr C := by unfold CErr; linarith
            have hx : 0 < Dd.x := by linarith
            have hb : 0 < Dd.b := by linarith
            have ha0 : 0 ≤ Dd.a := le_trans (mul_nonneg hx.le hb.le) ha
            obtain ⟨hA,hTT,hT2,hmL,hkU⟩ := hRest
            refine ⟨h3,he,hC,Fintype.card_pos,hb,ha0,hA,hTT,hT2,Finset.card_le_univ T2,hmL,hmU,hkL,hkU,?_,h26⟩
            simpa only [errorBracketSizeWindows] using hE
          
          
          end BorghettiRH
          #print axioms BorghettiRH.size_of_rest_and_error
          LEAN
          lake env lean -o RFH_rest.olean RFH_rest.lean 2>&1 | tee ../../bridge/assembly-logs/rest.log
      - name: Test UNO DUE TRE matched assembly
        if: ${{ (steps.cover.outcome == 'success' && steps.growth.outcome == 'success' && steps.rest.outcome == 'success') }}
        working-directory: upstream/lean
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFHMatchedChain.lean <<'LEAN'
          import RFH_cover
          import RFH_growth
          import RFH_rest
          import RFHMatchedBase
          open Finset UpperTheory.Top Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          /-- All geometric and arithmetic hypotheses concern the very same D, ell, TT and w. -/
          def MatchedCorePoint (B eps x : ℝ) : Prop :=
            ∃ (H : Type) (_ : AddCommGroup H) (_ : Fintype H) (_ : DecidableEq H)
              (U : Type) (_ : Fintype U) (W : U → Type) (_ : ∀ u, Fintype (W u)) (_ : ∀ u, Nonempty (W u))
              (Top : Type) (_ : Fintype Top) (m f : ℕ)
              (Dd : Data U W Top m f) (tr : U → H) (A0 : AddSubgroup H) (C : Consts) (Xpp eK K : ℝ)
              (D : ArithData H) (S : Finset ℕ) (ell : AddChar (E0 × H) ℂ → ℂ) (N : ℕ)
              (TT T2 : Finset H) (a : H → ℝ) (w : H → Fin m → E0 × H → ℝ)
              (eT : Top ≃ TT) (eP : Fin f ≃ PhiSet (H := H)) (η X' θ Cd CL : ℝ),
              Dd.x = x ∧ Dd.ε = eps ∧ CErr C ≤ B ∧ A0.index = 1 ∧
              (∀ u ∈ A0, ∃ v, tr v = u) ∧ HostFactsS D S ∧
              IdentU Dd tr D N ell TT a w eT eP ∧ SizeData₂ Dd C Xpp ∧
              ErrWindows Dd C Xpp eK K ∧ BNBoundsU Dd T2 ∧ LargeX Dd.x Dd.ε K C.cHH eK ∧
              RestSize Dd.ε Dd.x (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a ∧
              3 ≤ Dd.x ∧ 26 ≤ Dd.x ^ (3 * Dd.ε / 8) ∧
              SizesA A0 TT T2 a w N Dd.x Dd.b Dd.b' η X' θ ∧ ThinScales D ell X' θ ∧
              0 ≤ Cd ∧ DerivInt D ell Cd ∧ ValuesAtX D ell Dd.x Dd.ε CL ∧
              SmallCosts Dd.x Dd.ε (fPl H) Dd.b η θ Cd CL
          
          set_option maxHeartbeats 3000000 in
          theorem normalized_point_of_matched_core (B eps x : ℝ) (h : MatchedCorePoint B eps x) :
              NormalizedPoint (B+3) eps x := by
            obtain ⟨H,iH,iF,iD,U,iU,W,iW,iNW,Top,iT,m,f,Dd,tr,A0,C,Xpp,eK,K,
              D,S,ell,N,TT,T2,a,w,eT,eP,η,X',θ,Cd,CL,hx,he,hB,hi,hcov,hHost,hId,hSize,hWin,hBN,hLarge,hRest,
              h3,h26,hSz,hThin,hCd,hDer,hVal,hCost⟩ := h
            subst x
            subst eps
            have hCover := cover_of_index_one A0 hi tr hcov
            have hE := topExcess_le_of_geometric_data Dd tr C Xpp eK K D ell N TT T2 a w eT eP
              hId hSize hWin hBN hLarge hCover
            have hW := size_of_rest_and_error Dd C Xpp eK K (topExcess D N ell TT a w) TT T2 hWin hRest hE h3 h26
            have ⟨hP,hd,hR⟩ := normalized_error_of_size_windows (CErr C) Dd.ε Dd.x
              (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a (topExcess D N ell TT a w) hW
            have hb : 0 < Dd.b := hW.2.2.2.2.1
            have hε : 0 < Dd.ε := hW.2.1
            have hx1 : 1 ≤ Dd.x := by linarith
            have hGrowth := growth_of_index_one A0 hi D ell N m TT T2 a w Dd.x Dd.ε Dd.b Dd.b' η X' θ Cd CL
              h3 hb hCd hSz hThin hDer hVal
            have hExp : Dd.x ^ ((1 : ℝ) / 2 + (CErr C + 3) * Dd.ε) ≤
                Dd.x ^ ((1 : ℝ) / 2 + (B + 3) * Dd.ε) :=
              Real.rpow_le_rpow_of_exponent_le hx1 (by nlinarith [mul_nonneg (sub_nonneg.mpr hB) hε.le])
            exact ⟨H,iH,iF,iD,D,S,ell,N,m,TT,T2,a,w,Dd.b,Dd.b',η,X',θ,Cd,CL,hHost,hGrowth,hCost,
              hP,hd,hR.trans hExp⟩
          
          theorem rfh_of_matched_core_windows (B e1 : ℝ) (hB : 0 ≤ B) (h1 : 0 < e1)
              (h : ∀ eps : ℝ, 0 < eps → eps < e1 → ∀ Y0 : ℝ, ∃ Y : ℝ, Y0 ≤ Y ∧
                ∀ y ∈ Set.Icc Y (Y ^ (3/2 : ℝ)), MatchedCorePoint B eps y) : RiemannHypothesis := by
            apply rfh_of_normalized_windows (B+3) e1 (by linarith) h1
            intro eps he he1 Y0
            obtain ⟨Y,hY,hYwin⟩ := h eps he he1 Y0
            exact ⟨Y,hY,fun y hy => normalized_point_of_matched_core B eps y (hYwin y hy)⟩
          
          end BorghettiRH
          #print axioms BorghettiRH.normalized_point_of_matched_core
          #print axioms BorghettiRH.rfh_of_matched_core_windows
          open Lean Elab Command
          run_cmd do
            let env ← getEnv
            let edges : List (Name × Name) := [
              (``BorghettiRH.normalized_point_of_matched_core, ``BorghettiRH.cover_of_index_one),
              (``BorghettiRH.normalized_point_of_matched_core, ``BorghettiRH.growth_of_index_one),
              (``BorghettiRH.normalized_point_of_matched_core, ``BorghettiRH.size_of_rest_and_error),
              (``BorghettiRH.normalized_point_of_matched_core, ``BorghettiRH.topExcess_le_of_geometric_data),
              (``BorghettiRH.normalized_point_of_matched_core, ``BorghettiRH.normalized_error_of_size_windows),
              (``BorghettiRH.rfh_of_matched_core_windows, ``BorghettiRH.normalized_point_of_matched_core),
              (``BorghettiRH.rfh_of_matched_core_windows, ``BorghettiRH.rfh_of_normalized_windows)]
            for (a,b) in edges do
              let some ci := env.find? a | throwError "Missing declaration"
              let some v := ci.value? (allowOpaque := true) | throwError "Missing proof"
              unless v.getUsedConstants.contains b do
                throwError m!"Missing edge {a} -> {b}"
              logInfo m!"VERIFIED_CHAIN {a} -> {b}"
          
          LEAN
          lake env lean -o RFHMatchedChain.olean RFHMatchedChain.lean 2>&1 | tee ../../bridge/assembly-logs/chain.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = '\n'.join(Path('../../bridge/assembly-logs/'+n+'.log').read_text() for n in ['cover','growth','rest','chain'])
          for name in ['cover_of_index_one','growth_of_index_one','size_of_rest_and_error','normalized_point_of_matched_core','rfh_of_matched_core_windows']:
              m = re.search(r"BorghettiRH\."+name+r"' depends on axioms:\s*\[([^\]]*)\]",log)
              assert m, name
              assert {x.strip() for x in m.group(1).split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in log and log.count('VERIFIED_CHAIN') == 7
          PY
