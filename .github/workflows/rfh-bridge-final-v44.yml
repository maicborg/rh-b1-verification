      - name: Split TopG literature into bounded source modules
        if: false
        working-directory: upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib
          base = "Development.AutomorphicArithmetic.ThetaCorrespondence.ThetaPairLifts.ThirdPlaceSeries"
          d = Path(base.replace('.', '/'))
          p = d / "RFHLiteraturePrelude.lean"
          s = p.read_text()
          anchor = "set_option synthInstance.maxHeartbeats 200000"
          assert s.count(anchor) == 1
          header, tail = s.split(anchor)
          imports = [line for line in header.splitlines() if line.startswith("import ")]
          assert all(not line.strip() or line.startswith("import ") for line in header.splitlines())
          assert not any("RiemannHypothesisOfEveryCharacter" in line for line in imports)
          assert tail.rstrip().endswith("end")
          body = tail.rstrip()[:-3].rstrip() + "\n"
          assert body.startswith("\n\nsection\n")
          body = body[len("\n\nsection\n"):]
          starts = [m.start() for m in re.finditer(r"^theorem ", body, re.M)]
          assert len(starts) == 194
          assert not re.search(r"^(private |local |attribute |namespace |end\b)", body, re.M)
          blocks = [body[:starts[0]]] + [body[starts[i]:starts[i+1] if i+1<len(starts) else len(body)] for i in range(len(starts))]
          assert "".join(blocks) == body
          imods = []
          for i in range(0, len(imports), 5):
              name = f"RFHLitSmallImports{i//5:02d}"
              (d/(name+".lean")).write_text("\n".join(imports[i:i+5])+"\n")
              imods.append(base+"."+name)
          chunks = [blocks[:1]] + [blocks[i:i+25] for i in range(1,len(blocks),25)]
          assert "".join("".join(c) for c in chunks) == body
          mods = []
          for i, chunk in enumerate(chunks):
              name = f"RFHLitBlock{i:02d}"
              deps = imods if i==0 else [mods[-1]]
              code = "\n".join("import "+m for m in deps)+"\n\n"+anchor+"\n\nsection\n"+"".join(chunk)+"\nend\n"
              (d/(name+".lean")).write_text(code)
              mods.append(base+"."+name)
              print("LIT_BLOCK",name,len(code.splitlines()),hashlib.sha256(code.encode()).hexdigest())
          p.write_text("import "+mods[-1]+"\n")
          Path("rfh_topg_stages.json").write_text(json.dumps(imods+mods+[base+".RFHLiteraturePrelude"]))
          print("LIT_SPLIT",len(imods),len(mods),"theorems",len(starts))
          PY
