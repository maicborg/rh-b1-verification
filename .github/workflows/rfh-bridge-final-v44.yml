name: RFH | V44 extract preterminal tied core bridge
on:
  push:
    branches: [assembly/uno-due-tre-v2]
    paths: [.github/workflows/rfh-bridge-final-v44.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rfh-bridge-final-v44
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 4eaee87548250b2682affda7d05d947c05554bae
          path: upstream
          filter: blob:none
          sparse-checkout: lean
      - uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: src
      - name: Assemble pinned sources
        shell: bash
        run: |
          set -euo pipefail
          for folder in BuildAid CompanionTheory Development Formalism GroundTheory Lemmata PositivityTheory ReciprocityTheory Supplements; do
            cp -a "alpoge/src/$folder" "upstream/lean/$folder"
          done
          cat >> upstream/lean/lakefile.lean <<'EOF'
          lean_lib BuildAid where globs := #[`BuildAid.+]
          lean_lib CompanionTheory where globs := #[`CompanionTheory.+]
          lean_lib Development where globs := #[`Development.+]
          lean_lib Formalism where globs := #[`Formalism.+]
          lean_lib GroundTheory where globs := #[`GroundTheory.+]
          lean_lib Lemmata where globs := #[`Lemmata.+]
          lean_lib PositivityTheory where globs := #[`PositivityTheory.+]
          lean_lib ReciprocityTheory where globs := #[`ReciprocityTheory.+]
          lean_lib Supplements where globs := #[`Supplements.+]
          EOF
          mkdir -p upstream/lean/Development/AutomorphicArithmetic/MeanSquareBounds
          cp bridge/B2*.lean upstream/lean/Development/AutomorphicArithmetic/MeanSquareBounds/
          python3 bridge/ci/b2_prepare.py --root upstream/lean --bridge bridge --mode apply
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/lean/Development/AutomorphicArithmetic/DedekindLFunctions/LandauTheorems/mellinGchiOfNeOne.lean')
          s = p.read_text(encoding='utf-8')
          for old, new in [["      convert h1 using 1\n      · rfl\n      · ext m\n        simp only [F, ha]\n        ring\n      · simp","      convert h1 using 1\n      · funext m\n        simp only [F, ha]\n        ring\n      · simp"],["    convert h1 using 1\n    · rfl\n    · ext m\n      simp only [F]\n      rw [integral_const_mul, mellin_ramp (m + 1) (by omega) s hs,\n        LSeries.term_of_ne_zero (by omega), cpow_neg]\n      ring\n    · simp [LSeries]","    convert h1 using 1\n    · funext m\n      simp only [F]\n      rw [integral_const_mul, mellin_ramp (m + 1) (by omega) s hs,\n        LSeries.term_of_ne_zero (by omega), cpow_neg]\n      ring\n    · simp [LSeries]"]]:
              if s.count(old) != 1:
                  raise SystemExit('Unexpected pinned Mellin proof block')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Mellin compatibility: two exact tactic blocks patched; statements unchanged')
          PY
          python3 - <<'PY'
          from pathlib import Path
          for rel, old, new, count in [["Formalism/TameInertiaTowers/StatementGroup.lean","(powMonoidHom 2 : (GalL n ⧸ Subgroup.zpowers (JJ n)) →* _).range","(powMonoidHom (α := GalL n ⧸ Subgroup.zpowers (JJ n)) 2).range",2],["ReciprocityTheory/GaloisValuations/GlobalB.lean","Ideal.isMaximal_of_isIntegral_of_isMaximal_comap (R := 𝓞 F) Q","Ideal.isMaximal_of_isIntegral_of_isMaximal_under (R := 𝓞 F) Q",1],["ReciprocityTheory/GaloisValuations/GlobalB.lean","    (by rw [show Ideal.comap (algebraMap (𝓞 F) (IntCl F Ω)) Q = v.asIdeal from\n      under_primeBelow hA]; exact v.isMaximal)","    (by\n      rw [hQ, under_primeBelow hA]\n      exact v.isMaximal)",1]]:
              p = Path('upstream/lean') / rel
              s = p.read_text(encoding='utf-8')
              if s.count(old) != count:
                  raise SystemExit('Unexpected pinned compatibility block: ' + rel)
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('Compatibility patch:', rel)
          PY
          python3 - <<'PY'
          from pathlib import Path
          d = Path("upstream/lean/Development/AutomorphicArithmetic/CharacterBoxes")
          p = d / 'ExistsPageN.lean'
          q = d / 'PairGood.lean'
          s = p.read_text(encoding='utf-8')
          t = q.read_text(encoding='utf-8')
          block = "structure WinPair (eps Y : ℝ) (q d : ℕ) : Prop where\n  q_prime : q.Prime\n  q_mod : q % 8 = 3\n  q_lo : Y ^ (eps / 5) / 2 < Real.log q\n  q_up : Real.log q ≤ Y ^ (eps / 5)\n  d_prime : d.Prime\n  d_mod : d % 16 = 7\n  d_lo : Y ^ (eps / 5) * Real.log Y ^ 2 / 2 < Real.log d\n  d_up : Real.log d ≤ Y ^ (eps / 5) * Real.log Y ^ 2\n  d_q : q ∣ d + 1\n  d_small : ∀ p : ℕ, p.Prime → p ≠ 2 → (p : ℝ) ≤ Y ^ (eps / 5) → p ∣ d + 1\n"
          assert s.count(block) == 1
          old = 'import Development.AutomorphicArithmetic.CharacterBoxes.ExistsPageN\n'
          assert t.count(old) == 1
          new = 'import Development.AutomorphicArithmetic.CharacterBoxes.WinPairArithmetic\n'
          head = 'import Formalism.SharpRestriction.RamificationFrobenius.TotientGaloisClasses.ExplicitFormulaErrorOfHostConditions\n\nnoncomputable section\n\nnamespace UpperTheory.Top\n\nopen Formalism.HC\n\n'
          (d / 'WinPairArithmetic.lean').write_text(head + block + '\nend UpperTheory.Top\n\nend\n', encoding='utf-8')
          p.write_text(new + s.replace(block, ''), encoding='utf-8')
          q.write_text(t.replace(old, new), encoding='utf-8')
          print('WinPair extracted verbatim; original qualified declaration name retained; cohomology not patched')
          PY
          mkdir -p bridge/assembly-logs
          cp bridge/RHAssemblyV2.lean upstream/lean/RHAssemblyV2.lean
      - name: Install Lean
        working-directory: upstream/lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and Mathlib cache
        working-directory: upstream/lean
        timeout-minutes: 12
        run: |
          lake update
          lake exe cache get
          lean --version
      - name: Restore compatible compiled modules
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: upstream/lean/.lake/build
          key: rfh-bridge-final-v44-4341-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rfh-bridge-final-v42-4341-Linux-46137047131
            rfh-bridge-final-v39-4341-Linux-46131029624
            rfh-bridge-final-v36-4341-Linux-46126659783
            rfh-bridge-final-v35-4341-Linux-46107635466
            rfh-bridge-final-v32-4341-Linux-46072883155
            rfh-producer-micro-v30-4341-Linux-topg0-46063854311
            rfh-producer-micro-v30-4341-Linux-topg1-46063854311
            rfh-producer-micro-v30-4341-Linux-topg2-46063854311
            rfh-producer-micro-v28-4341-Linux-vwin-46060478517
            rfh-bridge-resume-v2-4341-Linux-45713390042
      - name: Gate 3A | restore geometric imports and elaborate cokernel
        working-directory: upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Development/AutomorphicArithmetic/CharacterBoxes/TwistForm.lean')
          s = p.read_text(encoding='utf-8')
          old = 'import Development.AutomorphicArithmetic.CharacterBoxes.PairGood\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + 'import Development.AutomorphicArithmetic.CharacterBoxes.ExistsPageN\n', 1), encoding='utf-8')
          p = Path('Formalism/GaloisCohomology/Statement.lean')
          s = p.read_text(encoding='utf-8')
          old = '''def PTCokerAt (D : LData F Ω l) (e : ℤ) : Prop :=
            PTCase F l →
              Module.length ℤ_[l] ((∀ v : D.S, H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) ⧸
                  LinearMap.range (localH2 D e)) =
                Module.length ℤ_[l] (H0 (qzTw D e))'''
          new = '''set_option backward.isDefEq.respectTransparency false in
          def PTCokerAt (D : LData F Ω l) (e : ℤ) : Prop := by
            letI : ∀ v : D.S, AddCommGroup (H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) :=
              fun v => inferInstance
            letI : ∀ v : D.S, Module ℤ_[l] (H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) :=
              fun v => inferInstance
            letI : AddCommGroup (∀ v : D.S, H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) :=
              Pi.addCommGroup
            letI : Module ℤ_[l] (∀ v : D.S, H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) :=
              Pi.module _ _ _
            exact PTCase F l →
              Module.length ℤ_[l] ((∀ v : D.S, H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) ⧸
                  LinearMap.range (localH2 D e)) =
                Module.length ℤ_[l] (H0 (qzTw D e))'''
          assert s.count(old) == 1, 'Unexpected pinned PTCokerAt block'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
