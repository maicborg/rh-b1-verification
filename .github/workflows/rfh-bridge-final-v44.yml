      - name: Check RFHFinalZeta
        working-directory: upstream/lean
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFHFinalZeta.lean <<'LEAN'
          import RFHFinalConditional
          import Development.AutomorphicArithmetic.PrimitiveCosets.RFHTiedCorePreterminal
          import Development.AutomorphicArithmetic.CharacterBoxes.RFHTopGInterface
          import Development.AutomorphicArithmetic.PrimitiveCosets.CoreAtH
          import Development.AutomorphicArithmetic.CharacterBoxes.SupplyChi
          open Finset UpperTheory.Top UpperTheory.Comparison₂ Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Formalism.LFunctionChainParameters.LHost Deduction.CH
          noncomputable section
          namespace BorghettiRH
          open GlobalTheory.EX
          theorem core_relax {φ : Frame} {H : HostRaw φ} {TT : Finset φ.A}
              {eD eL K cHH eK eps x : ℝ}
              (h : CoreAtH H TT eD eL K cHH eK eps x) :
              CoreAtH H TT (max eD 0) (max eL 0) K cHH eK eps x := by
            obtain ⟨U,iU,tr,W,iW,iNW,Top,iT,m,f,Dd,C,Xpp,ell,N,T2,a,w,eT,eP,η,X',θ,
              hell,hx,he,hD,hL,hHH,hcov,hId,hSize,hWin,hBN,hSz,hThin,hCost,hRest,hT2⟩ := h
            exact ⟨U,iU,tr,W,iW,iNW,Top,iT,m,f,Dd,C,Xpp,ell,N,T2,a,w,eT,eP,η,X',θ,
              hell,hx,he,hD.trans (le_max_left _ _),hL.trans (le_max_left _ _),hHH,hcov,hId,hSize,hWin,hBN,hSz,hThin,hCost,hRest,hT2⟩
          
          set_option maxHeartbeats 2000000 in
          theorem zeta_core_windows_of_topG (hTop : TopG) (hV : VWinAt PChar.one 401) :
              ZetaCoreWindows := by
            obtain ⟨eD,eL,e1,h1,h⟩ := hTop (3/2) (GChi PChar.one) (by norm_num)
              (supplyChi PChar.one hV) (hypV_of_cls PChar.one (3/2))
            refine ⟨max eD 0,max eL 0,e1,le_max_right _ _,le_max_right _ _,h1,?_⟩
            intro eps he he1
            obtain ⟨Fm,c,K,cHH,eK,CL,x0,hT⟩ := h eps he he1
            refine ⟨K,cHH,eK,?_⟩
            intro Y0
            have hw : HasWindows Fm.Win (3/2) := c.1
            obtain ⟨Y,hY,hwin⟩ := hw (max Y0 (max x0 (Fm.x1+1)))
            refine ⟨Y,(le_max_left _ _).trans hY,?_⟩
            intro x hx
            have hx0 : x0 ≤ x := (le_max_left x0 (Fm.x1+1)).trans ((le_max_right Y0 _).trans (hY.trans hx.1))
            have hxE : Fm.x1+1 ≤ x := (le_max_right x0 (Fm.x1+1)).trans ((le_max_right Y0 _).trans (hY.trans hx.1))
            obtain ⟨i,hi⟩ := tiedCore_of_chainTied Fm eD eL K cHH eK CL x (hT x hx0 (hwin x hx.1 hx.2))
            have hE := (c.2 x (by linarith) i).1
            rw [Fm.L_x x i (by linarith), Fm.L_eps x i] at hE
            exact ⟨_,(Fm.D x i).host.toHostAx, (Fm.D x i).host.TT,hE,core_relax hi⟩
          
          
          end BorghettiRH
          #print axioms BorghettiRH.core_relax
          #print axioms BorghettiRH.zeta_core_windows_of_topG
          LEAN
          lake env lean -o RFHFinalZeta.olean RFHFinalZeta.lean 2>&1 | tee ../../bridge/assembly-logs/RFHFinalZeta.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('../../bridge/assembly-logs/RFHFinalZeta.log').read_text()
          for n in ["core_relax","zeta_core_windows_of_topG"]:
              m = re.search(r'BorghettiRH\.'+n+r"' depends on axioms:\s*\[([^\]]*)\]",s)
              assert m,n
              assert {x.strip() for x in m.group(1).split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in s
          PY
      - name: Certify the conditional producer-input theorem and real dependency closure
        working-directory: upstream/lean
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFHProducerInputs.lean <<'LEAN'
          import RFHFinalZeta
          import Lean.Util.FoldConsts
          open Formalism.BasicNotions Formalism.MainNotions Formalism.HC UpperTheory.Top
          namespace BorghettiRH
          /-- The two genuine producer inputs remain explicit. No RH assumption. -/
          theorem rfh_of_producer_inputs (hTop : TopG) (hV : VWinAt PChar.one 401) :
              RiemannHypothesis :=
            rfh_of_zeta_core_windows (zeta_core_windows_of_topG hTop hV)
          end BorghettiRH
          #print axioms BorghettiRH.zeta_core_windows_of_topG
          #print axioms BorghettiRH.rfh_of_producer_inputs
          open Lean Elab Command
          set_option maxHeartbeats 0 in
          run_cmd do
            let env ← getEnv
            for (root, required, isBridge) in [
              (``BorghettiRH.zeta_core_windows_of_topG,
                [``UpperTheory.Top.supplyChi, ``QH.pairEx, ``UpperTheory.Top.winPairs,
                 ``BorghettiRH.b2_actual_h78, ``OAI.DirichletCharacter.LFunction_ne_zero_of_seven_eighths_lt_re], true),
              (``BorghettiRH.rfh_of_producer_inputs,
                [``BorghettiRH.zeta_core_windows_of_topG, ``BorghettiRH.rfh_of_zeta_core_windows,
                 ``BorghettiRH.rfh_of_matched_core_windows, ``BorghettiRH.normalized_point_of_matched_core,
                 ``BorghettiRH.rh_of_zeta_windows, ``BorghettiRH.budget_of_normalized_point,
                 ``BorghettiRH.due_windows_of_local_budget, ``QH.pairEx,
                 ``BorghettiRH.b2_actual_h78, ``OAI.DirichletCharacter.LFunction_ne_zero_of_seven_eighths_lt_re], false)] do
              let mut seen : Std.HashSet Name := {}
              let mut todo : Array Name := #[root]
              while !todo.isEmpty do
                let n := todo.back!
                todo := todo.pop
                if seen.contains n then continue
                seen := seen.insert n
                let ns := n.toString
                if ns.startsWith "UpperTheory.FinalTheorems." ||
                   ns == "UpperTheory.Top.zeroFreeAll_of_topG" ||
                   ns == "UpperTheory.LiteratureTheorems.every_character_of_literature_of_vWin" ||
                   ns == "UpperTheory.Top.zero_free_all_of_green_v_win" ||
                   ns == "UpperTheory.Top.every_character_of_green_v_win" ||
                   ns == "sorryAx" || (isBridge && ns == "RiemannHypothesis") then
                  throwError m!"Forbidden dependency in {root}: {n}"
                if let some ci := env.find? n then
                  for dep in ci.type.getUsedConstants do
                    if !seen.contains dep then todo := todo.push dep
                  if let some v := ci.value? (allowOpaque := true) then
                    for dep in v.getUsedConstants do
                      if !seen.contains dep then todo := todo.push dep
              for n in required do
                unless seen.contains n do throwError m!"Missing actual dependency in {root}: {n}"
                logInfo m!"VERIFIED_CLOSURE_EDGE {root} -> {n}"
              logInfo m!"AUDITED_CONDITIONAL_CLOSURE {root} {seen.size}"
          LEAN
          lake env lean -o RFHProducerInputs.olean RFHProducerInputs.lean 2>&1 | tee ../../bridge/assembly-logs/RFHProducerInputs.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path("../../bridge/assembly-logs/RFHProducerInputs.log").read_text()
          for n in ["zeta_core_windows_of_topG", "rfh_of_producer_inputs"]:
              m = re.search(r"BorghettiRH\."+n+r"' depends on axioms:\s*\[([^\]]*)\]", s)
              assert m, n
              assert {x.strip() for x in m.group(1).split(",") if x.strip()} <= {"propext", "Classical.choice", "Quot.sound"}
          assert s.count("AUDITED_CONDITIONAL_CLOSURE") == 2
          assert s.count("VERIFIED_CLOSURE_EDGE") == 15
          PY
      - name: Quiesce compiler processes before checkpoint
        if: always()
        shell: bash
        run: |
