name: 'B2 CRT - exact integer regression checks'
on:
  push:
    paths:
      - 'B2CRTCheck.py'
      - '.github/workflows/b2-crt-regression.yml'
  workflow_dispatch:

jobs:
  exact-crt:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test exact quadratic correlation and CRT cancellation
        run: python3 B2CRTCheck.py
