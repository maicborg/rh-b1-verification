name: "B2 mean-square without exceptional packet in pinned Alpoge"
on:
  push:
    paths:
      - "B2MeanSqNoExceptional.lean"
      - ".github/workflows/lean-b2-meansq-no-exception.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meanSq-no-exception:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout verification source
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout pinned Alpoge source
        uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Install elan
        working-directory: alpoge
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Copy proof to clone
        run: cp bridge/B2MeanSqNoExceptional.lean alpoge/B2MeanSqNoExceptional.lean
      - name: Resolve
        working-directory: alpoge
        run: lake update
      - name: Download mathlib cache
        working-directory: alpoge
        run: lake exe cache get
      - name: Restore Alpoge checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpoge-b2-0df444-${{ runner.os }}-
      - name: Build original MeanSqAbs
        id: upstream
        timeout-minutes: 290
        working-directory: alpoge
        run: lake build Development.AutomorphicArithmetic.MeanSquareBounds.MeanSqAbs
      - name: Kernel check new stronger B2 lemma
        id: proof
        timeout-minutes: 20
        working-directory: alpoge
        run: |
          lake env lean B2MeanSqNoExceptional.lean 2>&1 | tee /tmp/b2-meansq-no-exc.log
          if grep -q sorryAx /tmp/b2-meansq-no-exc.log; then exit 1; fi
      - name: Save checkpoint
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
