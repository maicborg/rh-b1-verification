name: "B2 - actual PNT Jacobi single endpoint normalized"
on:
  push:
    paths:
      - "B2JacobiRelativeActual.lean"
      - ".github/workflows/lean-b2-jacobi-relative-actual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b2-jacobi-relative:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout verification source
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout pinned Alpoge source
        uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Install elan
        working-directory: alpoge
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Copy proof modules into isolated Alpoge clone
        run: |
          mkdir -p alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds
          cp bridge/B2JacobiClassZero.lean alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds/
          cp bridge/B2NoExceptional.lean alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds/
          cp bridge/B2IntegratedBridge.lean alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds/
          cp bridge/B2JacobiRelativeActual.lean alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds/
      - name: Resolve Alpoge mathlib
        working-directory: alpoge
        run: lake update
      - name: Download mathlib cache
        working-directory: alpoge
        run: lake exe cache get
      - name: Restore prior Alpoge build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpoge-b2-0df444-${{ runner.os }}-
      - name: Compile kernel-checked single endpoint estimate
        id: proof
        working-directory: alpoge
        timeout-minutes: 290
        run: lake build Development.AutomorphicArithmetic.MeanSquareBounds.B2JacobiRelativeActual
      - name: Show theorem axioms
        if: ${{ success() }}
        working-directory: alpoge
        run: |
          set -o pipefail
          lake env lean src/Development/AutomorphicArithmetic/MeanSquareBounds/B2JacobiRelativeActual.lean 2>&1 | tee /tmp/b2-jacobi-axioms.log
          if grep -q 'sorryAx' /tmp/b2-jacobi-axioms.log; then exit 1; fi
      - name: Verify no placeholders
        run: |
          if grep -nE '\b(sorry|admit|axiom)\b' bridge/B2JacobiRelativeActual.lean; then exit 1; fi
      - name: Save build cache
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
