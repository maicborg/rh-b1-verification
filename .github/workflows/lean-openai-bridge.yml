name: 'Lean B1 - import OpenAI reale, compilation estesa'
on:
  push:
    paths:
      - '.github/workflows/lean-openai-bridge.yml'
      - 'B1OpenAI.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openai-bridge:
    runs-on: ubuntu-latest
    # GitHub-hosted hard limit: six hours. Leave time for saving partial build products.
    timeout-minutes: 350
    steps:
      - name: Checkout Borghetti verification source
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout pinned OpenAI math (isolated, sparse)
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 4eaee87548250b2682affda7d05d947c05554bae
          path: upstream
          filter: blob:none
          sparse-checkout: lean
      - name: Put verification file into isolated OpenAI worktree
        shell: bash
        run: |
          cp bridge/B1OpenAI.lean upstream/lean/B1OpenAI.lean
          test -f upstream/lean/OAI/NumberTheory/DirichletL/Nonvanishing.lean
          test -f upstream/lean/lean-toolchain
          echo "OpenAI source pinned: 4eaee87548250b2682affda7d05d947c05554bae"
      - name: Install Lean using elan
        working-directory: upstream/lean
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned OpenAI dependencies
        working-directory: upstream/lean
        run: lake update
      - name: Download Mathlib build cache
        working-directory: upstream/lean
        run: lake exe cache get
      - name: Restore previous OpenAI compilation checkpoint
        id: checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            upstream/lean/.lake/build
            upstream/lean/.lake/packages/*/.lake/build
          key: oai4341-4eaee875-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            oai4341-4eaee875-${{ runner.os }}-
      - name: Print runner resources
        run: |
          df -h .
          free -h
      - name: Compile original OpenAI 7/8 nonvanishing theorem
        id: upstream-build
        timeout-minutes: 305
        working-directory: upstream/lean
        run: |
          lake build OAI.NumberTheory.DirichletL.Nonvanishing
      - name: Kernel check of Borghetti B1 with the imported OpenAI theorem
        id: proof
        if: ${{ success() }}
        timeout-minutes: 10
        working-directory: upstream/lean
        run: |
          lake env lean B1OpenAI.lean
      - name: Save partial compiled dependencies for next attempt
        if: ${{ always() }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            upstream/lean/.lake/build
            upstream/lean/.lake/packages/*/.lake/build
          key: oai4341-4eaee875-${{ runner.os }}-${{ github.run_id }}
      - name: Report exact status (do not conflate preparation with a proof)
        if: ${{ always() }}
        shell: bash
        env:
          UPSTREAM_RESULT: ${{ steps.upstream-build.outcome }}
          PROOF_RESULT: ${{ steps.proof.outcome }}
        run: |
          echo "OpenAI original-module build: ${UPSTREAM_RESULT}"
          echo "B1 imported-theorem proof: ${PROOF_RESULT}"
          if [ "${PROOF_RESULT}" != "success" ]; then
            echo "::warning::B1 end-to-end proof NOT yet verified: see prior steps."
          fi
