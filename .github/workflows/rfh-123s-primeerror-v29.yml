name: RFH | 123 simplified V29 PrimeError frontier
on:
  push:
    branches: [assembly/rfh-123-simplified]
    paths:
      - 'RFH123S/PrimeError*.lean'
      - '.github/workflows/rfh-123s-primeerror-v29.yml'
      - 'scripts/check-primeerror-v29.sh'
  workflow_dispatch:
permissions:
  contents: read
env:
  UPSTREAM_PIN: 72fead102f663d5c7a407964a13dc0cf9d977207
jobs:
  scalar:
    name: "PrimeError | ${{ matrix.module }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [PrimeErrorKernel, PrimeErrorContour, PrimeErrorFourier, PrimeErrorAux, PrimeErrorTentBridge, PrimeErrorGrowthScalar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lsernau/grh-lean
          ref: ${{ env.UPSTREAM_PIN }}
          path: upstream
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        working-directory: upstream/grh-compact
        run: lake exe cache get
      - name: Compile exact microtarget and audit axioms
        run: bash scripts/check-primeerror-v29.sh upstream/grh-compact "${{ matrix.module }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v29-${{ matrix.module }}
          path: logs/
  preterminal:
    name: "PrimeError | ${{ matrix.module }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: PrimeErrorLaplace
            target: New.Endgame.PrimeError
          - module: PrimeErrorMean
            target: New.Endgame.PrimeError
          - module: PrimeErrorSeal
            target: New.Endgame.LongForms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lsernau/grh-lean
          ref: ${{ env.UPSTREAM_PIN }}
          path: upstream
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: upstream/grh-compact/.lake/build
          key: rfh123s-lean435-preterminal-v1-${{ env.UPSTREAM_PIN }}-${{ runner.os }}
      - name: Mathlib cache
        working-directory: upstream/grh-compact
        run: lake exe cache get
      - name: Build preterminal imports only
        working-directory: upstream/grh-compact
        run: |
          if [[ "${{ matrix.module }}" == "PrimeErrorSeal" ]]; then
            lake build +Statements +New.Endgame.LongForms +New.Data.DataExist +New.Endgame.OneSidedCriterion
          else
            lake build "+${{ matrix.target }}"
          fi
      - name: Compile exact dependency closure and audit axioms
        run: bash scripts/check-primeerror-v29.sh upstream/grh-compact "${{ matrix.module }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v29-${{ matrix.module }}
          path: logs/
  qrh-port:
    name: "PrimeError | OpenAI QRH actual port to Lean 4.35"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lsernau/grh-lean
          ref: ${{ env.UPSTREAM_PIN }}
          path: upstream
      - uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 4eaee87548250b2682affda7d05d947c05554bae
          path: oai
          sparse-checkout: lean/OAI
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: upstream/grh-compact/.lake/build
          key: rfh123s-lean435-preterminal-v1-${{ env.UPSTREAM_PIN }}-${{ runner.os }}
      - name: Mathlib cache
        working-directory: upstream/grh-compact
        run: lake exe cache get
      - name: Port actual unconditional producer without Foundation umbrella
        working-directory: upstream/grh-compact
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cp -R "$GITHUB_WORKSPACE/oai/lean/OAI" src/
          printf '\n[[lean_lib]]\nname = "OAI"\nglobs = ["OAI.+"]\n' >> lakefile.toml
          lake build +OAI.NumberTheory.DirichletL.Detector.FinalAssemblyUnconditional +Lib.Analytic.Landau.PolarLandau 2>&1 | tee "$GITHUB_WORKSPACE/logs/qrh-port.log"
      - name: Verify genuine entireL nonvanishing
        run: bash scripts/check-primeerror-v29.sh upstream/grh-compact PrimeErrorQRHPort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v29-qrh-port
          path: logs/
