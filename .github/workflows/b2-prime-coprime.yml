name: B2 CRT prime coprimality
on:
  push:
    paths:
      - B2PrimeAboveModulus.lean
      - .github/workflows/b2-prime-coprime.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: v4.33.0
          path: mathlib
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: mathlib
          use-mathlib-cache: true
          build-args: ''
      - name: Kernel check
        working-directory: mathlib
        run: |
          cp ../bridge/B2PrimeAboveModulus.lean .
          lake env lean B2PrimeAboveModulus.lean
