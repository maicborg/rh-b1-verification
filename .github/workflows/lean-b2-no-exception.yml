name: "B2 - OpenAI 7/8 eliminates Alpoge exceptional pair"
on:
  push:
    paths:
      - "B2NoExceptional.lean"
      - ".github/workflows/lean-b2-no-exception.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-exception:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout independent verification repo
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout pinned Alpoge source
        uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Install elan
        working-directory: alpoge
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Copy new theorem
        run: cp bridge/B2NoExceptional.lean alpoge/B2NoExceptional.lean
      - name: Lake update
        working-directory: alpoge
        run: lake update
      - name: Fetch mathlib cache
        working-directory: alpoge
        run: lake exe cache get
      - name: Restore alpoge compiled checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpoge-b2-0df444-${{ runner.os }}-
      - name: Build Alpoge input
        id: upstream
        timeout-minutes: 270
        working-directory: alpoge
        run: lake build Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.MeanSquareHypWIff
      - name: Kernel check no-exception proof
        id: proof
        timeout-minutes: 30
        working-directory: alpoge
        run: lake env lean B2NoExceptional.lean
      - name: Save Alpoge compiled checkpoint
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
      - name: Report exact proof outcome
        if: ${{ always() }}
        env:
          INPUT: ${{ steps.upstream.outcome }}
          PROOF: ${{ steps.proof.outcome }}
        run: |
          echo "Alpoge dependencies: $INPUT"
          echo "No-exception theorem: $PROOF"
