name: "B2 - Jacobi orthogonality in pinned Alpoge Lean"
on:
  push:
    paths:
      - "B2JacobiClassZero.lean"
      - ".github/workflows/lean-b2-alpoge-jacobi.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b2-jacobi-orthogonal:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout independent verification code
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Checkout pinned Alpoge source
        uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Install elan
        working-directory: alpoge
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Copy lemma to Alpoge test clone
        run: cp bridge/B2JacobiClassZero.lean alpoge/B2JacobiClassZero.lean
      - name: Resolve pinned dependencies
        working-directory: alpoge
        run: lake update
      - name: Fetch Mathlib cache
        working-directory: alpoge
        run: lake exe cache get
      - name: Restore Alpoge build checkpoints
        uses: actions/cache/restore@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpoge-b2-0df444-${{ runner.os }}-
      - name: Build Alpoge orthogonality dependencies
        id: upstream
        timeout-minutes: 280
        working-directory: alpoge
        run: lake build Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.MSqTwistA
      - name: Kernel check B2 general Jacobi lemma
        id: proof
        timeout-minutes: 25
        working-directory: alpoge
        run: lake env lean B2JacobiClassZero.lean
      - name: Save build checkpoints
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
      - name: Print proof result
        if: ${{ always() }}
        env:
          UP: ${{ steps.upstream.outcome }}
          PROOF: ${{ steps.proof.outcome }}
        run: |
          echo "Alpoge dependencies: $UP"
          echo "General Jacobi Lean lemma: $PROOF"
