name: B2 single endpoint RH-S
on:
  push:
    paths:
      - 'B2SingleEndpointRHS.lean'
      - '.github/workflows/lean-b2-single-endpoint-rhs.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean with elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib and generate Lake manifest
        run: lake update
      - name: Download Mathlib build cache
        run: lake exe cache get
      - name: Kernel check and axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean B2SingleEndpointRHS.lean 2>&1 | tee /tmp/b2-single-endpoint.log
          if grep -q 'sorryAx' /tmp/b2-single-endpoint.log; then exit 1; fi
      - name: Reject placeholders
        shell: bash
        run: |
          if grep -nE '\b(sorry|admit|axiom)\b' B2SingleEndpointRHS.lean; then exit 1; fi
