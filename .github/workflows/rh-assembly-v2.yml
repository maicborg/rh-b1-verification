            let env ← getEnv
            let edges : List (Name × Name) := [
              (``UpperTheory.Top.supplyChi, ``UpperTheory.Top.supplyOfAdm),
              (``UpperTheory.Top.supplyOfAdm, ``UpperTheory.T3.supplyOfAdmOf),
              (``UpperTheory.T3.supplyOfAdmOf, ``UpperTheory.Top.winPairs),
              (``UpperTheory.T3.supplyOfAdmOf, ``QH.pairEx),
              (``UpperTheory.T3.supplyOfAdmOf, ``UpperTheory.Top.boundedTw),
              (``UpperTheory.Top.boundedTw, ``UpperTheory.Top.PairGood.bounds)]
            for (a, b) in edges do
              let some ci := env.find? a | throwError m!"Missing declaration: {a}"
              let some v := ci.value? (allowOpaque := true) | throwError m!"No proof term for {a}"
              unless v.getUsedConstants.contains b do
                throwError m!"Missing proof dependency: {a} -> {b}"
              logInfo m!"VERIFIED_EDGE {a} -> {b}"
          LEAN
          lake env lean RHGate3AAudit.lean 2>&1 | tee ../../bridge/assembly-logs/gate3a-audit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('../../bridge/assembly-logs/gate3a-audit.log').read_text()
          expected = ['UpperTheory.Top.winPairs', 'UpperTheory.Top.boundedTw', 'UpperTheory.T3.supplyOfAdmOf', 'UpperTheory.Top.supplyOfAdm', 'UpperTheory.Top.supplyChi']
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name in expected:
              m = re.search(re.escape(name) + r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m:
                  raise SystemExit('Missing axiom report: ' + name)
              axioms = {x.strip() for x in m.group(1).split(',') if x.strip()}
              if not axioms <= allowed:
                  raise SystemExit(f'Unexpected axioms in {name}: {axioms}')
              print('VERIFIED', name, sorted(axioms))
          if 'sorryAx' in log or log.count('VERIFIED_EDGE') != 6:
              raise SystemExit('Gate 3A audit incomplete')
          PY
