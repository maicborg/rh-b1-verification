name: RH Assembly V2 | targeted Lean
on:
  push:
    branches: [assembly/uno-due-tre-v2]
    paths:
      - RHAssemblyV2.lean
      - .github/workflows/rh-assembly-v2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rh-assembly-v2
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 4eaee87548250b2682affda7d05d947c05554bae
          path: upstream
          filter: blob:none
          sparse-checkout: lean
      - uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: src
      - name: Assemble pinned sources
        shell: bash
        run: |
          set -euo pipefail
          for folder in BuildAid CompanionTheory Development Formalism GroundTheory Lemmata PositivityTheory ReciprocityTheory Supplements; do
            cp -a "alpoge/src/$folder" "upstream/lean/$folder"
          done
          cat >> upstream/lean/lakefile.lean <<'EOF'
          lean_lib BuildAid where globs := #[`BuildAid.+]
          lean_lib CompanionTheory where globs := #[`CompanionTheory.+]
          lean_lib Development where globs := #[`Development.+]
          lean_lib Formalism where globs := #[`Formalism.+]
          lean_lib GroundTheory where globs := #[`GroundTheory.+]
          lean_lib Lemmata where globs := #[`Lemmata.+]
          lean_lib PositivityTheory where globs := #[`PositivityTheory.+]
          lean_lib ReciprocityTheory where globs := #[`ReciprocityTheory.+]
          lean_lib Supplements where globs := #[`Supplements.+]
          EOF
          mkdir -p upstream/lean/Development/AutomorphicArithmetic/MeanSquareBounds
          cp bridge/B2*.lean upstream/lean/Development/AutomorphicArithmetic/MeanSquareBounds/
          python3 bridge/ci/b2_prepare.py --root upstream/lean --bridge bridge --mode apply
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/lean/Development/AutomorphicArithmetic/DedekindLFunctions/LandauTheorems/mellinGchiOfNeOne.lean')
          s = p.read_text(encoding='utf-8')
          for old, new in [["      convert h1 using 1\n      · rfl\n      · ext m\n        simp only [F, ha]\n        ring\n      · simp","      convert h1 using 1\n      · funext m\n        simp only [F, ha]\n        ring\n      · simp"],["    convert h1 using 1\n    · rfl\n    · ext m\n      simp only [F]\n      rw [integral_const_mul, mellin_ramp (m + 1) (by omega) s hs,\n        LSeries.term_of_ne_zero (by omega), cpow_neg]\n      ring\n    · simp [LSeries]","    convert h1 using 1\n    · funext m\n      simp only [F]\n      rw [integral_const_mul, mellin_ramp (m + 1) (by omega) s hs,\n        LSeries.term_of_ne_zero (by omega), cpow_neg]\n      ring\n    · simp [LSeries]"]]:
              if s.count(old) != 1:
                  raise SystemExit('Unexpected pinned Mellin proof block')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Mellin compatibility: two exact tactic blocks patched; statements unchanged')
          PY
          python3 - <<'PY'
          from pathlib import Path
          for rel, old, new, count in [["Formalism/TameInertiaTowers/StatementGroup.lean","(powMonoidHom 2 : (GalL n ⧸ Subgroup.zpowers (JJ n)) →* _).range","(powMonoidHom (α := GalL n ⧸ Subgroup.zpowers (JJ n)) 2).range",2],["ReciprocityTheory/GaloisValuations/GlobalB.lean","Ideal.isMaximal_of_isIntegral_of_isMaximal_comap (R := 𝓞 F) Q","Ideal.isMaximal_of_isIntegral_of_isMaximal_under (R := 𝓞 F) Q",1],["ReciprocityTheory/GaloisValuations/GlobalB.lean","    (by rw [show Ideal.comap (algebraMap (𝓞 F) (IntCl F Ω)) Q = v.asIdeal from\n      under_primeBelow hA]; exact v.isMaximal)","    (by\n      rw [hQ, under_primeBelow hA]\n      exact v.isMaximal)",1],["Formalism/GaloisCohomology/Statement.lean","def PTCokerAt (D : LData F Ω l) (e : ℤ) : Prop :=\n  PTCase F l →\n    Module.length ℤ_[l] ((∀ v : D.S, H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) ⧸\n        LinearMap.range (localH2 D e)) =\n      Module.length ℤ_[l] (H0 (qzTw D e))","private def ptCokerLengthCompat {R M N : Type*} [Ring R] [AddCommGroup M] [Module R M]\n    [AddCommGroup N] [Module R N] (f : M →ₗ[R] N) : ℕ∞ :=\n  Module.length R (N ⧸ LinearMap.range f)\n\ndef PTCokerAt (D : LData F Ω l) (e : ℤ) : Prop :=\n  PTCase F l →\n    @ptCokerLengthCompat _ _ _ _ _ _ _ _ (localH2 D e) =\n      Module.length ℤ_[l] (H0 (qzTw D e))",1]]:
              p = Path('upstream/lean') / rel
              s = p.read_text(encoding='utf-8')
              if s.count(old) != count:
                  raise SystemExit('Unexpected pinned compatibility block: ' + rel)
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('Compatibility patch:', rel)
          PY
          mkdir -p bridge/assembly-logs
          cp bridge/RHAssemblyV2.lean upstream/lean/RHAssemblyV2.lean
      - name: Install Lean
        working-directory: upstream/lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and Mathlib cache
        working-directory: upstream/lean
        timeout-minutes: 45
        run: |
          lake update
          lake exe cache get
          lean --version
      - name: Restore compatible compiled modules
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: upstream/lean/.lake/build
          key: rh-assembly-v2-4341-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rh-assembly-v2-4341-${{ runner.os }}-
            b2-incremental-lean4341-${{ runner.os }}-
      - name: Build only three imported targets
        working-directory: upstream/lean
        timeout-minutes: 115
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          time lake build Formalism.GL3MeanSquares.HookFormulaTorsion.WeightedVonMangoldtSumIdentity Development.AutomorphicArithmetic.DedekindLFunctions.LandauTheorems.ZeroFreeOfRpowWindow Formalism.GammaFactorNonvanishing.RhOfRight 2>&1 | tee ../../bridge/assembly-logs/imports.log
      - name: Kernel check V2 and audit all four declarations
        working-directory: upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean RHAssemblyV2.lean 2>&1 | tee ../../bridge/assembly-logs/v2.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path("../../bridge/assembly-logs/v2.log").read_text()
          expected = ["finite_transfer", "finite_transfer_bound", "zetaFamily_Gm", "rh_of_zeta_windows"]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in expected:
              pattern = r"BorghettiRH\." + name + r"' depends on axioms:\s*\[([^\]]*)\]"
              m = re.search(pattern, log)
              if not m:
                  raise SystemExit("Missing axiom report for " + name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= allowed:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print("VERIFIED", name, sorted(axioms))
          if "sorryAx" in log:
              raise SystemExit("sorryAx detected")
          PY
      - name: Gate 2 | preflight compatibility repairs
        working-directory: upstream/lean
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          time lake build Formalism.TameInertiaTowers.StatementGroup ReciprocityTheory.GaloisValuations.GlobalB Formalism.GaloisCohomology.Statement 2>&1 | tee ../../bridge/assembly-logs/gate2-preflight.log
      - name: Gate 2 | build pairEx using certified StagePow substitution
        working-directory: upstream/lean
        timeout-minutes: 115
        shell: bash
        run: |
          set -euo pipefail
          time lake build Development.AutomorphicArithmetic.MeanSquareBounds.pairEx 2>&1 | tee ../../bridge/assembly-logs/gate2-build.log
      - name: Gate 2 | verify axiom whitelist and actual proof dependencies
        working-directory: upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          cat > RHGate2Audit.lean <<'LEAN'
          import Development.AutomorphicArithmetic.MeanSquareBounds.pairEx
          import Lean.Util.FoldConsts
          open Lean Elab Command
          
          #print axioms QH.pairEx
          #print axioms QH.stage
          #print axioms QH.meanSqK
          #print axioms QH.twistK
          #print axioms BorghettiRH.b2_actual_h78
          
          run_cmd do
            let env ← getEnv
            let edges : List (Name × Name) := [
              (``QH.pairEx, ``QH.pair_exists),
              (``QH.pair_exists, ``QH.pair_share),
              (``QH.pair_share, ``QH.stage1),
              (``QH.pair_share, ``QH.stage2),
              (``QH.stage1, ``QH.stage),
              (``QH.stage2, ``QH.stage),
              (``QH.stage, ``QH.meanSqK),
              (``QH.meanSqK, ``QH.twistK),
              (``QH.twistK, ``QH.b2_twistK_no_exception_of_seven_eighths_v5),
              (``QH.twistK, ``BorghettiRH.b2_actual_h78),
              (``BorghettiRH.b2_actual_h78, ``OAI.DirichletCharacter.LFunction_ne_zero_of_seven_eighths_lt_re)]
            for (a, b) in edges do
              let some ci := env.find? a | throwError m!"Missing declaration: {a}"
              let some v := ci.value? | throwError m!"No proof term for {a}"
              unless v.getUsedConstants.contains b do
                throwError m!"Missing proof dependency: {a} -> {b}"
              logInfo m!"VERIFIED_EDGE {a} -> {b}"
          LEAN
          lake env lean RHGate2Audit.lean 2>&1 | tee ../../bridge/assembly-logs/gate2-audit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('../../bridge/assembly-logs/gate2-audit.log').read_text()
          expected = ['QH.pairEx', 'QH.stage', 'QH.meanSqK', 'QH.twistK', 'BorghettiRH.b2_actual_h78']
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name in expected:
              m = re.search(re.escape(name) + r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m:
                  raise SystemExit('Missing axiom report: ' + name)
              axioms = {x.strip() for x in m.group(1).split(',') if x.strip()}
              if not axioms <= allowed:
                  raise SystemExit(f'Unexpected axioms in {name}: {axioms}')
              print('VERIFIED', name, sorted(axioms))
          if 'sorryAx' in log or log.count('VERIFIED_EDGE') != 11:
              raise SystemExit('Gate 2 audit incomplete')
          PY
      - name: Save compiled modules even after failure
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: upstream/lean/.lake/build
          key: rh-assembly-v2-4341-${{ runner.os }}-${{ github.run_id }}
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-assembly-v2-${{ github.run_id }}
          path: bridge/assembly-logs/
          if-no-files-found: ignore
          retention-days: 14
