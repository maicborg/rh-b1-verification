name: "B2 RH-S two independent budgets audit"
on:
  push:
    paths:
      - "B2TwoBudgetsRHS.lean"
      - ".github/workflows/lean-b2-two-budgets-rhs.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Install elan
        working-directory: alpoge
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Copy independent lemma
        run: cp bridge/B2TwoBudgetsRHS.lean alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds/
      - name: Resolve dependencies
        working-directory: alpoge
        run: |
          lake update
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-two-budgets-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpoge-b2-two-budgets-${{ runner.os }}-
      - name: Build lemma
        working-directory: alpoge
        timeout-minutes: 290
        run: lake build Development.AutomorphicArithmetic.MeanSquareBounds.B2TwoBudgetsRHS
      - name: Kernel axioms
        working-directory: alpoge
        run: |
          set -o pipefail
          lake env lean src/Development/AutomorphicArithmetic/MeanSquareBounds/B2TwoBudgetsRHS.lean 2>&1 | tee /tmp/b2-rhs-axioms.log
          ! grep -q sorryAx /tmp/b2-rhs-axioms.log
      - name: Reject placeholders
        run: |
          ! grep -nE '\b(sorry|admit|axiom)\b' bridge/B2TwoBudgetsRHS.lean
      - uses: actions/cache/save@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-two-budgets-${{ runner.os }}-${{ github.run_id }}
