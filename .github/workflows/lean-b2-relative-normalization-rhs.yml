name: B2 relative normalization RH-S
on:
  push:
    paths:
      - 'B2RelativeNormalizationRHS.lean'
      - '.github/workflows/lean-b2-relative-normalization-rhs.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean with elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib and generate Lake manifest
        run: lake update
      - name: Download Mathlib build cache
        run: lake exe cache get
      - name: Kernel-check normalization and axioms
        shell: bash
        run: |
          lake env lean B2RelativeNormalizationRHS.lean 2>&1 | tee /tmp/b2-normalization.log
          if grep -q 'sorryAx' /tmp/b2-normalization.log; then exit 1; fi
      - name: Check forbidden placeholders
        shell: bash
        run: |
          if grep -nE '\b(sorry|admit|axiom)\b' B2RelativeNormalizationRHS.lean; then exit 1; fi
