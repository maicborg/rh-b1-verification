name: "B2 - real OpenAI 7/8 + Alpoge PNT same-kernel attempt"
on:
  push:
    paths:
      - '.github/workflows/lean-b2-real-h78-pnt-kernel-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forward-port:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: Checkout pinned original Alpoge into disposable clone
        uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Checkout pinned actual OpenAI Lean proof source
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 4eaee87548250b2682affda7d05d947c05554bae
          path: oai
          filter: blob:none
          sparse-checkout: |
            lean/OAI
      - name: Checkout B2 verification source
        uses: actions/checkout@v4
        with:
          path: bridge
      - name: Patch all known Mathlib 4.34 API breakages in disposable checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('alpoge')
          (root/'lean-toolchain').write_text('leanprover/lean4:v4.34.1\n')
          manifest = root/'lakefile.toml'
          t = manifest.read_text()
          a = '0df444a360eaa60ab8c11dca51a86af692955474'
          b = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          assert t.count(a) == 1
          manifest.write_text(t.replace(a,b,1))
          replacements = {
            'src/Formalism/GL3MeanSquares/GenusMeanAsymptotics/JacobiCharacterSums/ExistsFarFromPoints.lean':
              [('Finset.prod_le_prod', 'Finset.prod_le_prod₀', 1)],
            'src/Formalism/ZeroFreeRegion/ZetaLogDerivativeBounds/LandauLocalOf.lean':
              [('Finset.prod_le_prod', 'Finset.prod_le_prod₀', 2)],
            'src/Formalism/LandauZeroFreeBounds/ExceptionalZeroBounds/SameCharacterLFunctionOne.lean':
              [('Finset.prod_le_prod', 'Finset.prod_le_prod₀', 2),
               ('Finset.prod_le_one', 'Finset.prod_le_one₀', 1)],
            'src/Formalism/GL3MeanSquares/GenusMeanAsymptotics/JacobiCharacterSums/Turan2Main.lean':
              [('Finset.prod_le_prod', 'Finset.prod_le_prod₀', 1)],
            'src/Formalism/LandauZeroFreeBounds/ExceptionalZeroBounds/ExistsLocalZeroExpansionOfBound.lean':
              [('Finset.prod_le_prod', 'Finset.prod_le_prod₀', 2)],
            'src/Formalism/LandauZeroFreeBounds/ExceptionalZeroBounds/EulerFactorLogDerivBound.lean':
              [('logDeriv_prod (f :=', 'logDeriv_fun_prod (f :=', 1)]
          }
          for path, fixes in replacements.items():
            p = root/path
            s = p.read_text()
            for old,new,expected in fixes:
              count=s.count(old)
              assert count==expected, (path,old,count,expected)
              s=s.replace(old,new)
            p.write_text(s)
            print('API-ADAPTED', path, len(fixes), 'kinds of change')
          print('Only ephemeral Alpoge copy changed. Zero axioms, sorry or admissions introduced.')
          PY
      - name: Add original OAI source and bridge target ONLY to disposable clone
        run: |
          cp -a oai/lean/OAI alpoge/src/OAI
          cat >> alpoge/lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "OAI"
          globs = ["OAI.+"]
          EOF
          mkdir -p alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds
          cp bridge/B2NoExceptional.lean bridge/B2RealPNT.lean alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds/
          test -f alpoge/src/OAI/NumberTheory/DirichletL/Nonvanishing.lean
          test -f alpoge/src/Development/AutomorphicArithmetic/MeanSquareBounds/B2RealPNT.lean
      - name: Install elan
        working-directory: alpoge
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned OpenAI Mathlib and cache
        working-directory: alpoge
        run: |
          lake update
          lake exe cache get
      - name: Build actual OAI 7/8 + Alpoge PNTFinal in ONE Lean kernel
        working-directory: alpoge
        timeout-minutes: 270
        run: |
          set -o pipefail
          lake build Development.AutomorphicArithmetic.MeanSquareBounds.B2RealPNT 2>&1 | tee /tmp/b2-real-kernel-v4-build.log
      - name: Check real kernel axioms of PNT bridge
        working-directory: alpoge
        run: |
          set -o pipefail
          lake env lean src/Development/AutomorphicArithmetic/MeanSquareBounds/B2RealPNT.lean 2>&1 | tee /tmp/b2-real-kernel-v4-axioms.log
          if grep -q sorryAx /tmp/b2-real-kernel-v4-axioms.log; then
            echo "sorryAx detected: NOT CERTIFIED" >&2; exit 1
          fi
      - name: Record result
        if: ${{ always() }}
        run: |
          echo "B2 REAL OpenAI h78 + Alpoge PNT single-kernel attempt" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned Alpoge 7cbf7a0; pinned OAI Mathlib d13f23b; Lean4 v4.34.1" >> "$GITHUB_STEP_SUMMARY"
          echo "Original Alpoge and OpenAI repositories unchanged; DO NOT claim success unless all CI steps are green." >> "$GITHUB_STEP_SUMMARY"
