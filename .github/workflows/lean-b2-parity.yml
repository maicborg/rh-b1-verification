name: Lean B2 parity decomposition
on:
  push:
    paths:
      - 'B2ParityDecomp.lean'
      - '.github/workflows/lean-b2-parity.yml'
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - run: lake exe cache get
      - run: lake env lean B2ParityDecomp.lean
