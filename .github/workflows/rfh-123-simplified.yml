name: RFH | 123 simplified microtests
on:
  push:
    branches: [assembly/rfh-123-simplified]
  workflow_dispatch:
permissions:
  contents: read
env:
  UPSTREAM_PIN: 72fead102f663d5c7a407964a13dc0cf9d977207
jobs:
  elementary:
    name: "Micro | ${{ matrix.module }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [TentKernel, LogDisk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lsernau/grh-lean
          ref: ${{ env.UPSTREAM_PIN }}
          path: upstream
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        working-directory: upstream/grh-compact
        run: lake exe cache get
      - name: Compile independent microtest
        working-directory: upstream/grh-compact
        run: |
          set -o pipefail
          if [[ "${{ matrix.module }}" == "DensityAssemble" ]]; then
            bash "$GITHUB_WORKSPACE/scripts/check-density.sh" "$PWD" 2>&1 | tee "$GITHUB_WORKSPACE/micro-DensityAssemble.log"
          else
            lake env lean --tstack=400000 -DmaxHeartbeats=4000000 "$GITHUB_WORKSPACE/RFH123S/${{ matrix.module }}.lean" 2>&1 | tee "$GITHUB_WORKSPACE/micro-${{ matrix.module }}.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micro-${{ matrix.module }}
          path: micro-*.log
  literature:
    name: "Literature | pinned Perron and contour audit"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AlexKontorovich/PrimeNumberTheoremAnd
          ref: 127b50e33f6033e2147921167a117af96d9ba4ea
          path: literature-pnt
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build only Perron dependencies
        working-directory: literature-pnt
        run: |
          set -o pipefail
          lake exe cache get
          lake build +PrimeNumberTheoremAnd.PerronFormula 2>&1 | tee "$GITHUB_WORKSPACE/perron-build.log"
      - name: Check theorem signatures and axioms
        working-directory: literature-pnt
        run: |
          set -o pipefail
          lake env lean "$GITHUB_WORKSPACE/RFH123S/PerronLiteratureAudit.lean" 2>&1 | tee "$GITHUB_WORKSPACE/perron-audit.log"
          python3 -c 'import re; s=open("../perron-audit.log").read(); a=re.findall(r"depends on axioms: \\[([^\\]]*)\\]",s); assert len(a)==5,a; assert all(set(x.strip() for x in l.split(",") if x.strip())<={"propext","Classical.choice","Quot.sound"} for l in a),a'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perron-literature-audit
          path: perron-*.log
  geometry:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[scalar-only]') }}
    name: Dependency audit | minimal final closure
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lsernau/grh-lean
          ref: ${{ env.UPSTREAM_PIN }}
          path: upstream
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore dependency build
        id: preterminal-cache
        uses: actions/cache/restore@v4
        with:
          path: upstream/grh-compact/.lake/build
          key: rfh123s-lean435-preterminal-v1-${{ env.UPSTREAM_PIN }}-${{ runner.os }}
      - name: Mathlib cache
        working-directory: upstream/grh-compact
        run: lake exe cache get
      - name: Build preterminal dependencies (no New.Main)
        working-directory: upstream/grh-compact
        run: |
          set -o pipefail
          lake build +Statements +New.Endgame.LongForms +New.Data.DataExist +New.Endgame.OneSidedCriterion 2>&1 | tee "$GITHUB_WORKSPACE/upstream.log"
      - name: Save successful dependency build before candidate checks
        if: steps.preterminal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: upstream/grh-compact/.lake/build
          key: ${{ steps.preterminal-cache.outputs.cache-primary-key }}
      - name: Compile actual final dependency closure
        run: bash scripts/check-closure.sh upstream/grh-compact
      - name: Optional full regression (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/check.sh upstream/grh-compact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfh123s-build-logs
          path: |
            logs/
            upstream.log
