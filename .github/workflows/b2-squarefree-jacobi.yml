name: B2 - general squarefree Jacobi and CRT arithmetic tests
on:
  push:
    paths:
      - 'B2SquarefreeJacobiCheck.py'
      - '.github/workflows/b2-squarefree-jacobi.yml'
  workflow_dispatch:
jobs:
  squarefree-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check composite squarefree Jacobi cancellation in CRT
        run: python3 B2SquarefreeJacobiCheck.py
