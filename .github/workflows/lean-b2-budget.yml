name: 'Lean B2 - budget combinatorio (NON prova meanSqK)'
on:
  push:
    paths:
      - 'B2Budget.lean'
      - '.github/workflows/lean-b2-budget.yml'
  workflow_dispatch:

jobs:
  b2-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lean via elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve mathlib dependencies
        run: lake update
      - name: Mathlib cache
        run: lake exe cache get
      - name: Compile B2 counting budget with explicit analytic input
        run: lake env lean B2Budget.lean
