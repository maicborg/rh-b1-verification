name: RFH | 123 matched core
on:
  push:
    branches: [assembly/uno-due-tre-v2]
    paths:
      - .github/workflows/rfh-123-matched-core.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rfh-123-matched-core
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 4eaee87548250b2682affda7d05d947c05554bae
          path: upstream
          filter: blob:none
          sparse-checkout: lean
      - uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: src
      - name: Assemble pinned sources
        shell: bash
        run: |
          set -euo pipefail
          for folder in BuildAid CompanionTheory Development Formalism GroundTheory Lemmata PositivityTheory ReciprocityTheory Supplements; do
            cp -a "alpoge/src/$folder" "upstream/lean/$folder"
          done
          cat >> upstream/lean/lakefile.lean <<'EOF'
          lean_lib BuildAid where globs := #[`BuildAid.+]
          lean_lib CompanionTheory where globs := #[`CompanionTheory.+]
          lean_lib Development where globs := #[`Development.+]
          lean_lib Formalism where globs := #[`Formalism.+]
          lean_lib GroundTheory where globs := #[`GroundTheory.+]
          lean_lib Lemmata where globs := #[`Lemmata.+]
          lean_lib PositivityTheory where globs := #[`PositivityTheory.+]
          lean_lib ReciprocityTheory where globs := #[`ReciprocityTheory.+]
          lean_lib Supplements where globs := #[`Supplements.+]
          EOF
          mkdir -p upstream/lean/Development/AutomorphicArithmetic/MeanSquareBounds
          cp bridge/B2*.lean upstream/lean/Development/AutomorphicArithmetic/MeanSquareBounds/
          python3 bridge/ci/b2_prepare.py --root upstream/lean --bridge bridge --mode apply
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/lean/Development/AutomorphicArithmetic/DedekindLFunctions/LandauTheorems/mellinGchiOfNeOne.lean')
          s = p.read_text(encoding='utf-8')
          for old, new in [["      convert h1 using 1\n      · rfl\n      · ext m\n        simp only [F, ha]\n        ring\n      · simp","      convert h1 using 1\n      · funext m\n        simp only [F, ha]\n        ring\n      · simp"],["    convert h1 using 1\n    · rfl\n    · ext m\n      simp only [F]\n      rw [integral_const_mul, mellin_ramp (m + 1) (by omega) s hs,\n        LSeries.term_of_ne_zero (by omega), cpow_neg]\n      ring\n    · simp [LSeries]","    convert h1 using 1\n    · funext m\n      simp only [F]\n      rw [integral_const_mul, mellin_ramp (m + 1) (by omega) s hs,\n        LSeries.term_of_ne_zero (by omega), cpow_neg]\n      ring\n    · simp [LSeries]"]]:
              if s.count(old) != 1:
                  raise SystemExit('Unexpected pinned Mellin proof block')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Mellin compatibility: two exact tactic blocks patched; statements unchanged')
          PY
          python3 - <<'PY'
          from pathlib import Path
          for rel, old, new, count in [["Formalism/TameInertiaTowers/StatementGroup.lean","(powMonoidHom 2 : (GalL n ⧸ Subgroup.zpowers (JJ n)) →* _).range","(powMonoidHom (α := GalL n ⧸ Subgroup.zpowers (JJ n)) 2).range",2],["ReciprocityTheory/GaloisValuations/GlobalB.lean","Ideal.isMaximal_of_isIntegral_of_isMaximal_comap (R := 𝓞 F) Q","Ideal.isMaximal_of_isIntegral_of_isMaximal_under (R := 𝓞 F) Q",1],["ReciprocityTheory/GaloisValuations/GlobalB.lean","    (by rw [show Ideal.comap (algebraMap (𝓞 F) (IntCl F Ω)) Q = v.asIdeal from\n      under_primeBelow hA]; exact v.isMaximal)","    (by\n      rw [hQ, under_primeBelow hA]\n      exact v.isMaximal)",1]]:
              p = Path('upstream/lean') / rel
              s = p.read_text(encoding='utf-8')
              if s.count(old) != count:
                  raise SystemExit('Unexpected pinned compatibility block: ' + rel)
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('Compatibility patch:', rel)
          PY
          python3 - <<'PY'
          from pathlib import Path
          d = Path("upstream/lean/Development/AutomorphicArithmetic/CharacterBoxes")
          p = d / 'ExistsPageN.lean'
          q = d / 'PairGood.lean'
          s = p.read_text(encoding='utf-8')
          t = q.read_text(encoding='utf-8')
          block = "structure WinPair (eps Y : ℝ) (q d : ℕ) : Prop where\n  q_prime : q.Prime\n  q_mod : q % 8 = 3\n  q_lo : Y ^ (eps / 5) / 2 < Real.log q\n  q_up : Real.log q ≤ Y ^ (eps / 5)\n  d_prime : d.Prime\n  d_mod : d % 16 = 7\n  d_lo : Y ^ (eps / 5) * Real.log Y ^ 2 / 2 < Real.log d\n  d_up : Real.log d ≤ Y ^ (eps / 5) * Real.log Y ^ 2\n  d_q : q ∣ d + 1\n  d_small : ∀ p : ℕ, p.Prime → p ≠ 2 → (p : ℝ) ≤ Y ^ (eps / 5) → p ∣ d + 1\n"
          assert s.count(block) == 1
          old = 'import Development.AutomorphicArithmetic.CharacterBoxes.ExistsPageN\n'
          assert t.count(old) == 1
          new = 'import Development.AutomorphicArithmetic.CharacterBoxes.WinPairArithmetic\n'
          head = 'import Formalism.SharpRestriction.RamificationFrobenius.TotientGaloisClasses.ExplicitFormulaErrorOfHostConditions\n\nnoncomputable section\n\nnamespace UpperTheory.Top\n\nopen Formalism.HC\n\n'
          (d / 'WinPairArithmetic.lean').write_text(head + block + '\nend UpperTheory.Top\n\nend\n', encoding='utf-8')
          p.write_text(new + s.replace(block, ''), encoding='utf-8')
          q.write_text(t.replace(old, new), encoding='utf-8')
          print('WinPair extracted verbatim; original qualified declaration name retained; cohomology not patched')
          PY
          mkdir -p bridge/assembly-logs
          cp bridge/RHAssemblyV2.lean upstream/lean/RHAssemblyV2.lean
      - name: Install Lean
        working-directory: upstream/lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and Mathlib cache
        working-directory: upstream/lean
        timeout-minutes: 45
        run: |
          lake update
          lake exe cache get
          lean --version
      - name: Restore compatible compiled modules
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: upstream/lean/.lake/build
          key: rfh-123-matched-core-4341-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rfh-due-size-microtests-4341-${{ runner.os }}-45620331733
            rfh-normalized-producer-4341-${{ runner.os }}-45581729096
            rfh-due-normalized-error-4341-${{ runner.os }}-45615059492
      - name: Repair single known compatibility error
        working-directory: upstream/lean
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Formalism/SizeWindowBrackets/ChainSlopeWindows/LipschitzWeightAndMinimum.lean")
          s = p.read_text()
          old = "Finset.prod_le_one (fun _ _ => norm_nonneg _) (fun p _ => norm_cosetMean_le _ _ _)"
          assert s.count(old) == 1
          p.write_text(s.replace(old, old.replace("prod_le_one", "prod_le_one₀")))
          PY
      - name: Build normalized zeta balance targets
        working-directory: upstream/lean
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          lake build Development.AutomorphicArithmetic.MeanSquareBounds.pairEx Formalism.GL3MeanSquares.HookFormulaTorsion.WeightedVonMangoldtSumIdentity Formalism.GammaFactorNonvanishing.RhOfRight Development.AutomorphicArithmetic.ConductorsKronecker.CostPropositionBasicBound Development.AutomorphicArithmetic.DedekindLFunctions.LandauTheorems.ZeroFreeOfRpowWindow Formalism.SharpRestriction.RamificationFrobenius.TotientGaloisClasses.ExplicitFormulaErrorOfHostConditions Development.AutomorphicArithmetic.DedekindLFunctions.LandauTheorems.ChTop 2>&1 | tee ../../bridge/assembly-logs/normalized-imports.log
      - name: Load certified bridge lemmas in one local module
        working-directory: upstream/lean
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -o RHAssemblyV2.olean RHAssemblyV2.lean
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFHMatchedBase.lean <<'LEAN'
          import Development.AutomorphicArithmetic.ConductorsKronecker.CostPropositionBasicBound
          import Development.AutomorphicArithmetic.DedekindLFunctions.LandauTheorems.ZeroFreeOfRpowWindow
          import Formalism.SharpRestriction.RamificationFrobenius.TotientGaloisClasses.ExplicitFormulaErrorOfHostConditions
          import Development.AutomorphicArithmetic.MeanSquareBounds.pairEx
          import RHAssemblyV2
          import Development.AutomorphicArithmetic.DedekindLFunctions.LandauTheorems.ChTop
          import Lean.Util.FoldConsts
          
          noncomputable section
          open UpperTheory.Top Formalism Formalism.D5 Formalism.HC Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Deduction.CH
          open Finset Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain
          namespace BorghettiRH
          
          theorem gz_eq_direct :
              ∀ y : ℝ, Formalism.Gz y = An.G y ∧ An.G y = Deduction.G y := by
            intro y
            have hsum : ∑ n ∈ Finset.Icc 1 ⌊y⌋₊, ArithmeticFunction.vonMangoldt n * (y / (n : ℝ) - 1)
                = ∑ n ∈ Finset.Icc 1 ⌊y⌋₊, An.abelian₂ n * max (y / (n : ℝ) - 1) 0 := by
              apply Finset.sum_congr rfl
              intro n hn
              rw [Finset.mem_Icc] at hn
              have hn1 : (1 : ℝ) ≤ n := by exact_mod_cast hn.1
              have hy : (n : ℝ) ≤ y := by
                have hk : 0 < ⌊y⌋₊ := lt_of_lt_of_le Nat.zero_lt_one (le_trans hn.1 hn.2)
                have hy0 : 0 ≤ y := by
                  by_contra hneg
                  push_neg at hneg
                  rw [Nat.floor_eq_zero.2 (lt_trans hneg zero_lt_one)] at hk
                  exact lt_irrefl 0 hk
                exact le_trans (by exact_mod_cast hn.2) (Nat.floor_le hy0)
              have hpos : (0 : ℝ) < n := by linarith
              have : 0 ≤ y / (n : ℝ) - 1 := by
                rw [sub_nonneg, le_div_iff₀ hpos, one_mul]
                exact hy
              rw [max_eq_left this]
            have hre : (Deduction.ramp (fun _ => 1) y).re
                = ∑ n ∈ Finset.Icc 1 ⌊y⌋₊, An.abelian₂ n * max (y / (n : ℝ) - 1) 0 := by
              have hsub : Finset.Icc 1 ⌊y⌋₊ ⊆ Finset.range (⌊y⌋₊ + 1) := by
                intro n hn
                rw [Finset.mem_Icc] at hn
                rw [Finset.mem_range]
                omega
              rw [Finset.sum_subset hsub]
              · simp [Deduction.ramp, Complex.re_sum]
              · intro n hn hn'
                have h0 : n = 0 := by
                  rw [Finset.mem_range] at hn
                  rw [Finset.mem_Icc] at hn'
                  omega
                subst h0
                simp
            refine ⟨?_, ?_⟩
            · simp only [Formalism.Gz, Formalism.Sz, An.G]
              rw [hsum]
              ring
            · simp only [An.G, Deduction.G]
              rw [hre]
              ring
          
          theorem normalize_balance (P δ x Err g a : ℝ)
              (hP : 0 < P) (hd : 0 < δ) (hx : 0 < x)
              (h : P * (δ / 2) * (g - a) ≤ Err + 2 * P / x) :
              g ≤ Err / (P * (δ / 2)) + a + 4 / (δ * x) := by
            have hB : 0 < P * (δ / 2) := by positivity
            have h1 : g - a ≤ (Err + 2 * P / x) / (P * (δ / 2)) := by
              apply (le_div_iff₀ hB).2
              simpa only [mul_comm (g - a)] using h
            have h2 : (Err + 2 * P / x) / (P * (δ / 2)) =
                Err / (P * (δ / 2)) + 4 / (δ * x) := by
              field_simp [ne_of_gt hP, ne_of_gt hd, ne_of_gt hx]
              <;> ring
            rw [h2] at h1
            linarith
          
          theorem normalized_actual {H : Type} [AddCommGroup H] [Fintype H] [DecidableEq H]
              (D : ArithData H) (S : Finset ℕ) (hD : HostFactsS D S)
              (ell : AddChar (E0 × H) ℂ → ℂ) (N m : ℕ)
              (TT T2 : Finset H) (a : H → ℝ) (w : H → Fin m → E0 × H → ℝ)
              (x eps b b' η X' θ Cd CL : ℝ)
              (hH : GrowthInequalityHypotheses D ell N TT T2 a w x eps b b' η X' θ Cd CL (topExcess D N ell TT a w))
              (hS : SmallCosts x eps (fPl H) b η θ Cd CL)
              (hP : 0 < (TT.card : ℝ) * m * b) (hd : 0 < delta2 T2) :
              Deduction.G x ≤ topExcess D N ell TT a w / ((TT.card : ℝ) * m * b * (delta2 T2 / 2)) +
                4 * x ^ ((1 : ℝ) / 2 + eps) + 4 / (delta2 T2 * x) := by
            have h := UpperTheory.GL.card_mul_delta_le_err D S hD ell N m TT T2 a w x eps b b' η X' θ Cd CL
              (topExcess D N ell TT a w) hH hS
            have hx : 0 < x := by linarith [hH.1]
            rw [(gz_eq_direct x).1, (gz_eq_direct x).2] at h
            apply normalize_balance _ _ _ _ _ _ hP hd hx
            simpa only [mul_assoc] using h
          
          theorem absorb_normalized (C eps : ℝ) (hC : 0 ≤ C) (he : 0 < eps) :
              ∃ X : ℝ, ∀ x ≥ X, ∀ (g R : ℝ),
                g ≤ R + 4 * x ^ ((1 : ℝ) / 2 + eps) →
                R ≤ x ^ ((1 : ℝ) / 2 + C * eps) →
                g ≤ x ^ ((1 : ℝ) / 2 + (C + 2) * eps) := by
            obtain ⟨X,hX⟩ := Filter.eventually_atTop.1
              ((tendsto_rpow_atTop he).eventually_ge_atTop (5 : ℝ))
            refine ⟨max 1 X, ?_⟩
            intro x hx g R hg hR
            have hx1 : 1 ≤ x := (le_max_left _ _).trans hx
            have hx0 : 0 < x := zero_lt_one.trans_le hx1
            have h1 : x ^ ((1 : ℝ) / 2 + eps) ≤ x ^ ((1 : ℝ) / 2 + (C+1)*eps) :=
              Real.rpow_le_rpow_of_exponent_le hx1 (by nlinarith)
            have h2 : x ^ ((1 : ℝ) / 2 + C*eps) ≤ x ^ ((1 : ℝ) / 2 + (C+1)*eps) :=
              Real.rpow_le_rpow_of_exponent_le hx1 (by nlinarith)
            calc
              g ≤ 5 * x ^ ((1 : ℝ) / 2 + (C+1)*eps) := by linarith
              _ ≤ x ^ eps * x ^ ((1 : ℝ) / 2 + (C+1)*eps) :=
                mul_le_mul_of_nonneg_right (hX x ((le_max_right _ _).trans hx)) (Real.rpow_nonneg hx0.le _)
              _ = x ^ ((1 : ℝ) / 2 + (C+2)*eps) := by
                rw [← Real.rpow_add hx0]
                congr 1
                ring
          
          theorem three_modes_of_pairGood {H : Type} [AddCommGroup H] [Fintype H] [DecidableEq H]
              (D : ArithData H) (ell : AddChar (E0 × H) ℂ → ℂ)
              (eps Y X x : ℝ) (q d : ℕ) (he : 0 < eps) (hx : 1 ≤ x)
              (hY : Y ≤ x) (hX : x ≤ X) (hP : PairGood 1 eps Y X q d)
              (hMatch : ∀ ψ : AddChar (E0 × H) ℂ, (ψ = psC ∨ ψ = chC ∨ ψ = chpsC) →
                ∃ (ξ : DirichletCharacter ℂ 1) (i j : Fin 2), (i ≠ 0 ∨ j ≠ 0) ∧
                  ∃ (p : PChar),
                    An.Induces p.χ (tw (fun a => ξ (a : ZMod 1)) q d i j) (2 * 1 * q * d) ∧
                    GPsi D ell ψ x = An.gChi p.χ x ∧ ell ψ = An.logDerivativeAtOne p.χ) :
              ValuesAtX D ell x eps 4 := by
            intro ψ hψ
            obtain ⟨ξ,i,j,hij,p,hI,hG,hL⟩ := hMatch ψ hψ
            haveI := p.ne
            obtain ⟨hg,hl⟩ := hP.bounds ξ i j hij p.N p.χ hI x hY hX
            rw [hG,hL]
            exact ⟨hg.trans (Real.rpow_le_rpow_of_exponent_le hx (by linarith)),hl⟩
          
          theorem zeta_pair_windows (eps : ℝ) (he : 0 < eps) (he52 : eps < 1/52) :
              ∃ X : ℝ, ∀ Y ≥ X, ∃ q d : ℕ,
                PairGood 1 eps Y (Y ^ (3/2 : ℝ)) q d := by
            exact QH.pairEx 1 (by norm_num) eps (3/2) he he52 (by norm_num)
          
          theorem due_small_budget (K e1 θ : ℝ) (h1 : 0 < e1)
              (hθ : 1 / 2 < θ) :
              ∃ e : ℝ, 0 < e ∧ e < e1 ∧ 1 / 2 + K * e ≤ θ := by
            let e : ℝ := min (e1 / 2) ((θ - 1 / 2) / (2 * (1 + |K|)))
            have hd : 0 < θ - 1 / 2 := sub_pos.mpr hθ
            have hden : 0 < 2 * (1 + |K|) := by positivity
            have he : 0 < e := lt_min (by linarith) (div_pos hd hden)
            have he1 : e < e1 := (min_le_left _ _).trans_lt (by linarith)
            have hediv : e ≤ (θ - 1 / 2) / (2 * (1 + |K|)) := min_le_right _ _
            have hmul := (le_div_iff₀ hden).mp hediv
            have hprod : K * e ≤ |K| * e :=
              mul_le_mul_of_nonneg_right (le_abs_self K) he.le
            have hnonneg : 0 ≤ |K| * e := mul_nonneg (abs_nonneg K) he.le
            exact ⟨e, he, he1, by nlinarith⟩
          
          /-- Conditional quantitative transfer on the genuine Deduction.G,
              with the geometric producer left explicit. -/
          theorem due_windows_of_local_budget
              (K e1 : ℝ) (h1 : 0 < e1)
              (h : ∀ e : ℝ, 0 < e → e < e1 → ∃ X : ℝ,
                ∀ Y₀ : ℝ, ∃ Y : ℝ, Y₀ ≤ Y ∧
                  ∀ y ∈ Set.Icc Y (Y ^ (3 / 2 : ℝ)),
                    X ≤ y → Deduction.G y ≤ y ^ (1 / 2 + K * e)) :
              ∀ θ : ℝ, 1 / 2 < θ → θ < 1 → ∀ Y₀ : ℝ, ∃ Y : ℝ,
                Y₀ ≤ Y ∧ ∀ y ∈ Set.Icc Y (Y ^ (3 / 2 : ℝ)),
                  Deduction.G y ≤ y ^ θ := by
            intro θ hθ _ Y₀
            obtain ⟨e, he, he1, hexp⟩ := due_small_budget K e1 θ h1 hθ
            obtain ⟨X, hX⟩ := h e he he1
            obtain ⟨Y, hY, hw⟩ := hX (max Y₀ (max X 1))
            refine ⟨Y, (le_max_left _ _).trans hY, ?_⟩
            intro y hy
            have hb : max X 1 ≤ y := (le_max_right _ _).trans (hY.trans hy.1)
            have hx : X ≤ y := (le_max_left _ _).trans hb
            have hy1 : 1 ≤ y := (le_max_right _ _).trans hb
            exact (hw y hy hx).trans (Real.rpow_le_rpow_of_exponent_le hy1 hexp)
          
          theorem gpsi_eq_gchi_of_coefficients {H : Type} [AddCommGroup H] [Fintype H] [DecidableEq H]
              (D : ArithData H) (ell : AddChar (E0 × H) ℂ → ℂ)
              (ψ : AddChar (E0 × H) ℂ) (p : PChar) (x : ℝ)
              (hψ : ψ ≠ 0) (hχ : p.χ ≠ 1)
              (hp : ∀ n : ℕ, n ≠ 0 → primVal D ψ n = p.χ (n : ZMod p.N))
              (hl : ell ψ = An.logDerivativeAtOne p.χ) :
              GPsi D ell ψ x = An.gChi p.χ x := by
            classical
            haveI := p.ne
            simp only [GPsi, if_neg hψ, An.gChi, if_neg hχ, An.sumLamChi, hl]
            congr 1
            apply Finset.sum_congr rfl
            intro n hn
            have hn1 : 1 ≤ n := (Finset.mem_Icc.1 hn).1
            have hn0 : n ≠ 0 := by omega
            have hnR : (0 : ℝ) < n := by exact_mod_cast (Nat.pos_of_ne_zero hn0)
            have hk : 0 < ⌊x⌋₊ := lt_of_lt_of_le Nat.zero_lt_one (le_trans hn1 (Finset.mem_Icc.1 hn).2)
            have hx0 : 0 ≤ x := by
              by_contra hneg
              push_neg at hneg
              rw [Nat.floor_eq_zero.2 (lt_trans hneg zero_lt_one)] at hk
              exact lt_irrefl 0 hk
            have hnx : (n : ℝ) ≤ x := le_trans (by exact_mod_cast (Finset.mem_Icc.1 hn).2) (Nat.floor_le hx0)
            have hr : 0 ≤ x / (n : ℝ) - 1 := by
              rw [sub_nonneg, le_div_iff₀ hnR, one_mul]
              exact hnx
            rw [hp n hn0, max_eq_left hr]
          
          theorem three_modes_of_primitive_coefficients {H : Type} [AddCommGroup H] [Fintype H] [DecidableEq H]
              (D : ArithData H) (ell : AddChar (E0 × H) ℂ → ℂ)
              (eps Y X x : ℝ) (q d : ℕ) (he : 0 < eps) (hx : 1 ≤ x)
              (hY : Y ≤ x) (hX : x ≤ X) (hP : PairGood 1 eps Y X q d)
              (hMatch : ∀ ψ : AddChar (E0 × H) ℂ, (ψ = psC ∨ ψ = chC ∨ ψ = chpsC) →
                ∃ (ξ : DirichletCharacter ℂ 1) (i j : Fin 2), (i ≠ 0 ∨ j ≠ 0) ∧
                  ∃ (p : PChar),
                    An.Induces p.χ (tw (fun a => ξ (a : ZMod 1)) q d i j) (2 * 1 * q * d) ∧
                    ψ ≠ 0 ∧ p.χ ≠ 1 ∧
                    (∀ n : ℕ, n ≠ 0 → primVal D ψ n = p.χ (n : ZMod p.N)) ∧
                    ell ψ = An.logDerivativeAtOne p.χ) :
              ValuesAtX D ell x eps 4 := by
            apply three_modes_of_pairGood D ell eps Y X x q d he hx hY hX hP
            intro ψ hψ
            obtain ⟨ξ,i,j,hij,p,hI,hn,hp,hc,hl⟩ := hMatch ψ hψ
            exact ⟨ξ,i,j,hij,p,hI,gpsi_eq_gchi_of_coefficients D ell ψ p x hn hp hc hl,hl⟩
          
          /-- Pointwise producer interface: no bound on G itself is a premise. -/
          def NormalizedPoint (C eps x : ℝ) : Prop :=
            ∃ (H : Type) (_ : AddCommGroup H) (_ : Fintype H) (_ : DecidableEq H)
              (D : ArithData H) (S : Finset ℕ)
              (ell : AddChar (E0 × H) ℂ → ℂ) (N m : ℕ)
              (TT T2 : Finset H) (a : H → ℝ) (w : H → Fin m → E0 × H → ℝ)
              (b b' η X' θ Cd CL : ℝ),
              HostFactsS D S ∧
              GrowthInequalityHypotheses D ell N TT T2 a w x eps b b' η X' θ Cd CL (topExcess D N ell TT a w) ∧
              SmallCosts x eps (fPl H) b η θ Cd CL ∧
              0 < (TT.card : ℝ) * m * b ∧ 0 < delta2 T2 ∧
              topExcess D N ell TT a w / ((TT.card : ℝ) * m * b * (delta2 T2 / 2)) +
                4 / (delta2 T2 * x) ≤ x ^ ((1 : ℝ) / 2 + C * eps)
          
          theorem budget_of_normalized_point (C eps : ℝ) (hC : 0 ≤ C) (he : 0 < eps) :
              ∃ X : ℝ, ∀ x ≥ X, NormalizedPoint C eps x →
                Deduction.G x ≤ x ^ ((1 : ℝ) / 2 + (C + 2) * eps) := by
            obtain ⟨X,hX⟩ := absorb_normalized C eps hC he
            refine ⟨X,?_⟩
            intro x hx h
            obtain ⟨H, hA, hF, hDec, D,S,ell,N,m,TT,T2,a,w,b,b',η,X',θ,Cd,CL,hD,hH,hS,hP,hd,hR⟩ := h
            have hg := @normalized_actual H hA hF hDec D S hD ell N m TT T2 a w x eps b b' η X' θ Cd CL hH hS hP hd
            apply hX x hx (Deduction.G x) _ _ hR
            linarith
          
          theorem rfh_of_normalized_windows (C e1 : ℝ) (hC : 0 ≤ C) (h1 : 0 < e1)
              (h : ∀ e : ℝ, 0 < e → e < e1 → ∀ Y₀ : ℝ, ∃ Y : ℝ, Y₀ ≤ Y ∧
                ∀ y ∈ Set.Icc Y (Y ^ (3 / 2 : ℝ)), NormalizedPoint C e y) :
              RiemannHypothesis := by
            apply rh_of_zeta_windows
            apply due_windows_of_local_budget (C + 2) e1 h1
            intro e he he1
            obtain ⟨X,hX⟩ := budget_of_normalized_point C e hC he
            refine ⟨X,?_⟩
            intro Y₀
            obtain ⟨Y,hY,hw⟩ := h e he he1 Y₀
            exact ⟨Y,hY,fun y hy hx => hX y hx (hw y hy)⟩
          
          theorem topExcess_le_of_gapA {H : Type} [AddCommGroup H] [Fintype H] [DecidableEq H]
              (D : ArithData H) (N m : ℕ) (ell : AddChar (E0 × H) ℂ → ℂ)
              (TT : Finset H) (a : H → ℝ) (w : H → Fin m → E0 × H → ℝ)
              (B : ℝ) (h : ∀ u : H, gapA D N ell TT a w u ≤ B) :
              topExcess D N ell TT a w ≤ B := by
            have hn : (0 : ℝ) < Fintype.card H := by exact_mod_cast Fintype.card_pos
            have hs : (∑ u : H, gapA D N ell TT a w u) ≤ (Fintype.card H : ℝ) * B := by
              calc
                (∑ u : H, gapA D N ell TT a w u) ≤ ∑ _u : H, B :=
                  Finset.sum_le_sum fun u _ => h u
                _ = _ := by simp [nsmul_eq_mul]
            change (1 / (Fintype.card H : ℝ)) * (∑ u : H, gapA D N ell TT a w u) ≤ B
            calc
              _ ≤ (1 / (Fintype.card H : ℝ)) * ((Fintype.card H : ℝ) * B) :=
                mul_le_mul_of_nonneg_left hs (by positivity)
              _ = B := by field_simp
          
          theorem topExcess_le_of_geometric_data
              {H : Type} [AddCommGroup H] [Fintype H] [DecidableEq H]
              {U0 : Type} [Fintype U0] {W : U0 → Type}
              [∀ u, Fintype (W u)] [∀ u, Nonempty (W u)]
              {Top : Type} [Fintype Top] {m f : ℕ}
              (Dd : Data U0 W Top m f) (tr : U0 → H) (C : Consts) (Xpp eK K : ℝ)
              (D : ArithData H) (ell : AddChar (E0 × H) ℂ → ℂ)
              (N : ℕ) (TT T2 : Finset H) (a : H → ℝ)
              (w : H → Fin m → E0 × H → ℝ)
              (eT : Top ≃ TT) (eP : Fin f ≃ PhiSet (H := H))
              (hId : IdentU Dd tr D N ell TT a w eT eP)
              (hSize : SizeData₂ Dd C Xpp) (hWin : ErrWindows Dd C Xpp eK K)
              (hBN : BNBoundsU Dd T2) (hLarge : LargeX Dd.x Dd.ε K C.cHH eK)
              (hCover : Function.Surjective tr) :
              topExcess D N ell TT a w ≤
                Dd.x ^ (CErr C * Dd.ε) *
                  errorBracketSizeWindows Dd.x Dd.ε (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a := by
            apply topExcess_le_of_gapA D N m ell TT a w
            intro u
            obtain ⟨v, rfl⟩ := hCover u
            exact Deduction.ch_top Dd tr C Xpp eK K D ell N TT T2 a w eT eP hId hSize hWin hBN hLarge v
          
          theorem normalized_error_of_size_windows
              (C eps x : ℝ) (n nT nT2 m : ℕ) (b k aE E : ℝ)
              (hW : SizeWindows C eps x n nT nT2 m b k aE E) :
              0 < (nT : ℝ) * m * b ∧ 0 < (nT2 : ℝ) / n ∧
                E / ((nT : ℝ) * m * b * ((nT2 : ℝ) / n / 2)) +
                  4 / (((nT2 : ℝ) / n) * x) ≤ x ^ ((1 : ℝ) / 2 + (C + 3) * eps) := by
            have hw := hW
            obtain ⟨hx3, he, hC, hn, hb, ha0, ha, hT, hd, hT2, hm, hm2, hk, hk2, hE, h26⟩ := hw
            have hx : 0 < x := by linarith
            have hnR : (0 : ℝ) < n := by exact_mod_cast hn
            have hmR : (0 : ℝ) < m :=
              lt_of_lt_of_le (Real.rpow_pos_of_pos hx _) hm
            have hTR : (0 : ℝ) < nT := lt_of_lt_of_le (by positivity) hT
            let P : ℝ := (nT : ℝ) * m * b
            let δ : ℝ := (nT2 : ℝ) / n
            let R : ℝ := E / (P * (δ / 2)) + 4 / (δ * x)
            let X : ℝ := x ^ ((1 : ℝ) / 2 + eps)
            have hP : 0 < P := by dsimp [P]; positivity
            have hδ : 0 < δ := lt_of_lt_of_le (Real.rpow_pos_of_pos hx _) hd
            have hX : 0 ≤ X := by dsimp [X]; positivity
            have hbal : (nT : ℝ) * m * b * (((nT2 : ℝ) / n) / 2) *
                ((R + 4 * X) - 4 * x ^ ((1 : ℝ) / 2 + eps)) ≤
                  E + 2 * (nT : ℝ) * m * b / x := by
              have hAssoc : 2 * (nT : ℝ) * m * b / x = 2 * P / x := by
                dsimp only [P]
                ring
              rw [hAssoc]
              change P * (δ / 2) * ((R + 4 * X) - 4 * X) ≤ E + 2 * P / x
              rw [add_sub_cancel_right]
              have hEq : P * (δ / 2) * R = E + 2 * P / x := by
                dsimp only [R]
                field_simp [ne_of_gt hP, ne_of_gt hδ, ne_of_gt hx] <;> ring
              exact hEq.le
            have hg := proposition_size_bound C eps x n nT nT2 m b k aE E (R + 4 * X) hW hbal
            refine ⟨hP, hδ, ?_⟩
            change R ≤ x ^ ((1 : ℝ) / 2 + (C + 3) * eps)
            linarith
          
          
          end BorghettiRH
          LEAN
          lake env lean -o RFHMatchedBase.olean RFHMatchedBase.lean 2>&1 | tee ../../bridge/assembly-logs/base.log
      - name: Microtest cover
        id: cover
        continue-on-error: true
        working-directory: upstream/lean
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFH_cover.lean <<'LEAN'
          import RFHMatchedBase
          open Finset UpperTheory.Top Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          theorem cover_of_index_one {H : Type} [AddCommGroup H] (A0 : AddSubgroup H)
              (h : A0.index = 1) {U : Type} (tr : U → H)
              (hc : ∀ u ∈ A0, ∃ v, tr v = u) : Function.Surjective tr := by
            have ht : A0 = ⊤ := AddSubgroup.index_eq_one.mp h
            intro u
            apply hc u
            rw [ht]
            trivial
          
          
          end BorghettiRH
          #print axioms BorghettiRH.cover_of_index_one
          LEAN
          lake env lean -o RFH_cover.olean RFH_cover.lean 2>&1 | tee ../../bridge/assembly-logs/cover.log
      - name: Microtest growth
        id: growth
        continue-on-error: true
        working-directory: upstream/lean
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFH_growth.lean <<'LEAN'
          import RFHMatchedBase
          open Finset UpperTheory.Top Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          theorem growth_of_index_one {H : Type} [AddCommGroup H] [Fintype H] [DecidableEq H]
              (A0 : AddSubgroup H) (hi : A0.index = 1)
              (D : ArithData H) (ell : AddChar (E0 × H) ℂ → ℂ)
              (N m : ℕ) (TT T2 : Finset H) (a : H → ℝ) (w : H → Fin m → E0 × H → ℝ)
              (x eps b b' η X' θ Cd CL : ℝ)
              (hx : 3 ≤ x) (hb : 0 < b) (hc : 0 ≤ Cd)
              (hSz : SizesA A0 TT T2 a w N x b b' η X' θ)
              (hThin : ThinScales D ell X' θ) (hDer : DerivInt D ell Cd)
              (hVal : ValuesAtX D ell x eps CL) :
              GrowthInequalityHypotheses D ell N TT T2 a w x eps b b' η X' θ Cd CL
                (topExcess D N ell TT a w) := by
            have ht : A0 = ⊤ := AddSubgroup.index_eq_one.mp hi
            have ha0 : ∀ u : H, u ∈ A0 := by intro u; rw [ht]; trivial
            obtain ⟨hη,hXp,hbp,hbX,hθ,ha,hp,hth,hthin,hN⟩ := hSz
            exact ⟨hx,hb,hη,hXp,hbp,hbX,hθ,hc,ha,
              ⟨fun u j ρ hρ => hp u (ha0 u) j ρ hρ,
                fun u j ρ hρ => hth u (ha0 u) j ρ hρ,
                fun u j ρ hρ hn => hthin u (ha0 u) j ρ hρ hn⟩,
              fun u j t ρ hT hρ => hN u (ha0 u) j t ρ hT hρ,
              le_rfl,hThin,lipschitz_weight_all H D ell,hDer,hVal⟩
          
          
          end BorghettiRH
          #print axioms BorghettiRH.growth_of_index_one
          LEAN
          lake env lean -o RFH_growth.olean RFH_growth.lean 2>&1 | tee ../../bridge/assembly-logs/growth.log
      - name: Microtest rest
        id: rest
        continue-on-error: true
        working-directory: upstream/lean
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFH_rest.lean <<'LEAN'
          import RFHMatchedBase
          open Finset UpperTheory.Top Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          set_option maxHeartbeats 2000000 in
          theorem size_of_rest_and_error
              {H : Type} [AddCommGroup H] [Fintype H] [DecidableEq H]
              {U : Type} [Fintype U] {W : U → Type} [∀ u, Fintype (W u)] [∀ u, Nonempty (W u)]
              {Top : Type} [Fintype Top] {m f : ℕ}
              (Dd : Data U W Top m f) (C : Consts) (Xpp eK K E : ℝ) (TT T2 : Finset H)
              (hWin : ErrWindows Dd C Xpp eK K)
              (hRest : RestSize Dd.ε Dd.x (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a)
              (hE : E ≤ Dd.x ^ (CErr C * Dd.ε) *
                errorBracketSizeWindows Dd.x Dd.ε (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a)
              (h3 : 3 ≤ Dd.x) (h26 : 26 ≤ Dd.x ^ (3 * Dd.ε / 8)) :
              SizeWindows (CErr C) Dd.ε Dd.x (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a E := by
            have hh := hWin
            unfold ErrWindows ErrWindows0 ConstsBound at hh
            have he : 0 < Dd.ε := by tauto
            have hb1 : 1 ≤ Dd.b := by tauto
            have ha : Dd.x * Dd.b ≤ Dd.a := by tauto
            have hmU : (m : ℝ) ≤ Dd.x ^ ((1 : ℝ) / 2 + Dd.ε / 2) := by tauto
            have hkL : Dd.x * m ≤ Dd.k := by tauto
            have hcD : 0 ≤ C.eDiv := by tauto
            have hcL : 0 ≤ C.eLoss := by tauto
            have hC : 0 ≤ CErr C := by unfold CErr; linarith
            have hx : 0 < Dd.x := by linarith
            have hb : 0 < Dd.b := by linarith
            have ha0 : 0 ≤ Dd.a := le_trans (mul_nonneg hx.le hb.le) ha
            obtain ⟨hA,hTT,hT2,hmL,hkU⟩ := hRest
            refine ⟨h3,he,hC,Fintype.card_pos,hb,ha0,hA,hTT,hT2,Finset.card_le_univ T2,hmL,hmU,hkL,hkU,?_,h26⟩
            simpa only [errorBracketSizeWindows] using hE
          
          
          end BorghettiRH
          #print axioms BorghettiRH.size_of_rest_and_error
          LEAN
          lake env lean -o RFH_rest.olean RFH_rest.lean 2>&1 | tee ../../bridge/assembly-logs/rest.log
      - name: Test UNO DUE TRE matched assembly
        if: steps.cover.outcome == 'success' && steps.growth.outcome == 'success' && steps.rest.outcome == 'success'
        working-directory: upstream/lean
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFHMatchedChain.lean <<'LEAN'
          import RFH_cover
          import RFH_growth
          import RFH_rest
          import RFHMatchedBase
          open Finset UpperTheory.Top Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          /-- All geometric and arithmetic hypotheses concern the very same D, ell, TT and w. -/
          def MatchedCorePoint (B eps x : ℝ) : Prop :=
            ∃ (H : Type) (_ : AddCommGroup H) (_ : Fintype H) (_ : DecidableEq H)
              (U : Type) (_ : Fintype U) (W : U → Type) (_ : ∀ u, Fintype (W u)) (_ : ∀ u, Nonempty (W u))
              (Top : Type) (_ : Fintype Top) (m f : ℕ)
              (Dd : Data U W Top m f) (tr : U → H) (A0 : AddSubgroup H) (C : Consts) (Xpp eK K : ℝ)
              (D : ArithData H) (S : Finset ℕ) (ell : AddChar (E0 × H) ℂ → ℂ) (N : ℕ)
              (TT T2 : Finset H) (a : H → ℝ) (w : H → Fin m → E0 × H → ℝ)
              (eT : Top ≃ TT) (eP : Fin f ≃ PhiSet (H := H)) (η X' θ Cd CL : ℝ),
              Dd.x = x ∧ Dd.ε = eps ∧ CErr C ≤ B ∧ A0.index = 1 ∧
              (∀ u ∈ A0, ∃ v, tr v = u) ∧ HostFactsS D S ∧
              IdentU Dd tr D N ell TT a w eT eP ∧ SizeData₂ Dd C Xpp ∧
              ErrWindows Dd C Xpp eK K ∧ BNBoundsU Dd T2 ∧ LargeX Dd.x Dd.ε K C.cHH eK ∧
              RestSize Dd.ε Dd.x (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a ∧
              3 ≤ Dd.x ∧ 26 ≤ Dd.x ^ (3 * Dd.ε / 8) ∧
              SizesA A0 TT T2 a w N Dd.x Dd.b Dd.b' η X' θ ∧ ThinScales D ell X' θ ∧
              0 ≤ Cd ∧ DerivInt D ell Cd ∧ ValuesAtX D ell Dd.x Dd.ε CL ∧
              SmallCosts Dd.x Dd.ε (fPl H) Dd.b η θ Cd CL
          
          set_option maxHeartbeats 3000000 in
          theorem normalized_point_of_matched_core (B eps x : ℝ) (h : MatchedCorePoint B eps x) :
              NormalizedPoint (B+3) eps x := by
            obtain ⟨H,iH,iF,iD,U,iU,W,iW,iNW,Top,iT,m,f,Dd,tr,A0,C,Xpp,eK,K,
              D,S,ell,N,TT,T2,a,w,eT,eP,η,X',θ,Cd,CL,hx,he,hB,hi,hcov,hHost,hId,hSize,hWin,hBN,hLarge,hRest,
              h3,h26,hSz,hThin,hCd,hDer,hVal,hCost⟩ := h
            subst x
            subst eps
            have hCover := cover_of_index_one A0 hi tr hcov
            have hE := topExcess_le_of_geometric_data Dd tr C Xpp eK K D ell N TT T2 a w eT eP
              hId hSize hWin hBN hLarge hCover
            have hW := size_of_rest_and_error Dd C Xpp eK K (topExcess D N ell TT a w) TT T2 hWin hRest hE h3 h26
            have ⟨hP,hd,hR⟩ := normalized_error_of_size_windows (CErr C) Dd.ε Dd.x
              (Fintype.card H) TT.card T2.card m Dd.b Dd.k Dd.a (topExcess D N ell TT a w) hW
            have hb : 0 < Dd.b := hW.2.2.2.2.1
            have hε : 0 < Dd.ε := hW.2.1
            have hx1 : 1 ≤ Dd.x := by linarith
            have hGrowth := growth_of_index_one A0 hi D ell N m TT T2 a w Dd.x Dd.ε Dd.b Dd.b' η X' θ Cd CL
              h3 hb hCd hSz hThin hDer hVal
            have hExp : Dd.x ^ ((1 : ℝ) / 2 + (CErr C + 3) * Dd.ε) ≤
                Dd.x ^ ((1 : ℝ) / 2 + (B + 3) * Dd.ε) :=
              Real.rpow_le_rpow_of_exponent_le hx1 (by nlinarith [mul_nonneg (sub_nonneg.mpr hB) hε.le])
            exact ⟨H,iH,iF,iD,D,S,ell,N,m,TT,T2,a,w,Dd.b,Dd.b',η,X',θ,Cd,CL,hHost,hGrowth,hCost,
              hP,hd,hR.trans hExp⟩
          
          theorem rfh_of_matched_core_windows (B e1 : ℝ) (hB : 0 ≤ B) (h1 : 0 < e1)
              (h : ∀ eps : ℝ, 0 < eps → eps < e1 → ∀ Y0 : ℝ, ∃ Y : ℝ, Y0 ≤ Y ∧
                ∀ y ∈ Set.Icc Y (Y ^ (3/2 : ℝ)), MatchedCorePoint B eps y) : RiemannHypothesis := by
            apply rfh_of_normalized_windows (B+3) e1 (by linarith) h1
            intro eps he he1 Y0
            obtain ⟨Y,hY,hYwin⟩ := h eps he he1 Y0
            exact ⟨Y,hY,fun y hy => normalized_point_of_matched_core B eps y (hYwin y hy)⟩
          
          end BorghettiRH
          #print axioms BorghettiRH.normalized_point_of_matched_core
          #print axioms BorghettiRH.rfh_of_matched_core_windows
          open Lean Elab Command
          run_cmd do
            let env ← getEnv
            let edges : List (Name × Name) := [
              (``BorghettiRH.normalized_point_of_matched_core, ``BorghettiRH.cover_of_index_one),
              (``BorghettiRH.normalized_point_of_matched_core, ``BorghettiRH.growth_of_index_one),
              (``BorghettiRH.normalized_point_of_matched_core, ``BorghettiRH.size_of_rest_and_error),
              (``BorghettiRH.normalized_point_of_matched_core, ``BorghettiRH.topExcess_le_of_geometric_data),
              (``BorghettiRH.normalized_point_of_matched_core, ``BorghettiRH.normalized_error_of_size_windows),
              (``BorghettiRH.rfh_of_matched_core_windows, ``BorghettiRH.normalized_point_of_matched_core),
              (``BorghettiRH.rfh_of_matched_core_windows, ``BorghettiRH.rfh_of_normalized_windows)]
            for (a,b) in edges do
              let some ci := env.find? a | throwError "Missing declaration"
              let some v := ci.value? (allowOpaque := true) | throwError "Missing proof"
              unless v.getUsedConstants.contains b do
                throwError m!"Missing edge {a} -> {b}"
              logInfo m!"VERIFIED_CHAIN {a} -> {b}"
          
          LEAN
          lake env lean RFHMatchedChain.lean 2>&1 | tee ../../bridge/assembly-logs/chain.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = '\n'.join(Path('../../bridge/assembly-logs/'+n+'.log').read_text() for n in ['cover','growth','rest','chain'])
          for name in ['cover_of_index_one','growth_of_index_one','size_of_rest_and_error','normalized_point_of_matched_core','rfh_of_matched_core_windows']:
              m = re.search(r"BorghettiRH\."+name+r"' depends on axioms:\s*\[([^\]]*)\]",log)
              assert m, name
              assert {x.strip() for x in m.group(1).split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in log and log.count('VERIFIED_CHAIN') == 7
          PY
      - name: Require all microtest outcomes
        if: always()
        run: |
          test "${{ steps.cover.outcome }} ${{ steps.growth.outcome }} ${{ steps.rest.outcome }}" = "success success success"
      - name: Save compiled modules
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: upstream/lean/.lake/build
          key: rfh-123-matched-core-4341-${{ runner.os }}-${{ github.run_id }}
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfh-123-matched-core-${{ github.run_id }}
          path: bridge/assembly-logs/
          if-no-files-found: ignore
          retention-days: 14
