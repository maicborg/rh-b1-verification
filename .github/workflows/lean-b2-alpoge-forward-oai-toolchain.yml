name: "B2 - test Alpoge forward port into OpenAI Lean 4.34.1"
on:
  push:
    paths:
      - '.github/workflows/lean-b2-alpoge-forward-oai-toolchain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: Checkout original pinned Alpoge into isolated clone
        uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Rewrite toolchain and Mathlib pin in disposable clone only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('alpoge')
          (root/'lean-toolchain').write_text('leanprover/lean4:v4.34.1\n')
          f=root/'lakefile.toml'
          s=f.read_text()
          old='0df444a360eaa60ab8c11dca51a86af692955474'
          assert s.count(old)==1
          f.write_text(s.replace(old,'d13f23b723b8a846827a245b89c10fc7d3f11612'))
          print("Only ephemeral checked-out Alpoge environment changed")
          PY
      - name: Install elan
        working-directory: alpoge
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve OAI pinned mathlib
        working-directory: alpoge
        run: |
          lake update
          lake exe cache get
      - name: Try build actual Alpoge PNTFinal in OAI Mathlib
        working-directory: alpoge
        timeout-minutes: 230
        run: lake build Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.PNTFinal
