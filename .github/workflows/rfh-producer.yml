          edit("Formalism/TameInertiaTowers/CentralOrderTwo/NegOneNeOneUnitsZmodFour.lean",
               "noncomputable def eGamE (s : ℕ) : GamE s ≃* Multiplicative (ZMod (2 ^ s)) × ℤˣ × ℤˣ :=\n  ((QuotientGroup.quotientMulEquivOfEq (phiE_ker s).symm).trans\n    (QuotientGroup.quotientKerEquivOfSurjective _ (phiE_surj s))).trans\n    (MulEquiv.prodCongr (eQQ s) (MulEquiv.refl _))",
               "noncomputable def eGamE (s : ℕ) : GamE s ≃* Multiplicative (ZMod (2 ^ s)) × ℤˣ × ℤˣ := by\n  let e1 : GamE s ≃* (GalL (s + 2) ⧸ (phiE s).ker) :=\n    QuotientGroup.quotientMulEquivOfEq (phiE_ker s).symm\n  let e2 : (GalL (s + 2) ⧸ (phiE s).ker) ≃* QQ s × ℤˣ × ℤˣ :=\n    QuotientGroup.quotientKerEquivOfSurjective (phiE s) (phiE_surj s)\n  let e3 : (QQ s × ℤˣ × ℤˣ) ≃* Multiplicative (ZMod (2 ^ s)) × ℤˣ × ℤˣ :=\n    MulEquiv.prodCongr (eQQ s) (MulEquiv.refl (ℤˣ × ℤˣ))\n  exact (e1.trans e2).trans e3", 1)
          PY
          python3 - <<'PY'
          from pathlib import Path
          for rel, old, new in [
              ("Development/AutomorphicArithmetic/ThickFrames/MarkedGe.lean",
               "Finset.prod_le_prod (fun _ _ => by linarith)", "Finset.prod_le_prod₀ (fun _ _ => by linarith)"),
              ("Development/AbelianVarietyTheory/Proofs/GlobalInterpolation/TuranSecondMainTheoremPowerSumsUnitCoefficients.lean",
               "Finset.prod_le_prod (fun _ _ => zero_le_one)", "Finset.prod_le_prod₀ (fun _ _ => zero_le_one)"),
              ("Development/AbelianVarietyTheory/Proofs/GlobalInterpolation/TuranSecondMainTheoremPowerSumsUnitCoefficients.lean",
               "Finset.prod_le_prod (fun _ _ => abs_nonneg _)", "Finset.prod_le_prod₀ (fun _ _ => abs_nonneg _)")
          ]:
              p = Path(rel)
              t = p.read_text(encoding="utf-8")
              assert t.count(old) == 1, f"Unexpected pinned block: {rel}"
              p.write_text(t.replace(old, new), encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path
          edits = [["Formalism/HarderNarasimhan/HarderNarasimhanProofs/GramBlock.lean","apply Finset.prod_le_one\n","apply Finset.prod_le_one₀\n"],["Formalism/GL3MeanSquares/HookFormulaTorsion/GlobalBoundRefinements.lean","    apply Finset.prod_le_prod\n    · intro ρ hρ","    apply Finset.prod_le_prod₀\n    · intro ρ hρ"],["Development/AutomorphicArithmetic/ThickFrames/MarkedGe.lean","Finset.prod_le_one (fun j _ => hg0 j _)","Finset.prod_le_one₀ (fun j _ => hg0 j _)"],["Development/AutomorphicArithmetic/ThickFrames/MarkedGe.lean","Finset.prod_le_prod (fun j _ => by split_ifs <;> positivity)","Finset.prod_le_prod₀ (fun j _ => by split_ifs <;> positivity)"],["Development/AutomorphicArithmetic/ThickFrames/MarkedGe.lean","        obtain ⟨hc1, hc⟩ := _root_.not_imp.1 hc\n        obtain ⟨hc2, hc⟩ := _root_.not_imp.1 hc","        push_neg at hc\n        obtain ⟨hc1, hc2, hc⟩ := hc"],["Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ExplicitFormula/LStructA.lean","  rw [hld, logDeriv_mul","  rw [hld]\n  change logDeriv ((fun w : ℂ => (w - ρ) ^ analyticOrderNatAt f ρ) * g) s = _\n  rw [logDeriv_mul"],["Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ExplicitFormula/NormLogDerivReflLe.lean","  rw [logDeriv_mul (f := fun z => ∏ ρ ∈ Z, (φ ρ z) ^ (m ρ))","  change logDeriv ((fun z : ℂ => ∏ ρ ∈ Z, (φ ρ z) ^ (m ρ)) * h) s = _\n  rw [logDeriv_mul (f := fun z => ∏ ρ ∈ Z, (φ ρ z) ^ (m ρ))"],["Development/AbelianVarietyTheory/Proofs/GlobalInterpolation/NormOneSubConjMul.lean","      conv_lhs => rw [e]\n      rw [logDeriv_mul","      conv_lhs => rw [e]\n      change logDeriv ((fun z : ℂ => ∏ w ∈ S, (z - w) ^ m w) * g) z = _\n      rw [logDeriv_mul"],["Formalism/SuccessiveMinima/SuccessiveMinimaProofs/MeasureEqCovolumeMulVolumeImage.lean","B.equivFunL.lipschitz.isBounded_image","B.equivFunL.toContinuousLinearMap.lipschitz.isBounded_image"]]
          for rel, old, new in edits:
              p = Path(rel)
              t = p.read_text(encoding="utf-8")
              assert t.count(old) == 1, f"Unexpected pinned block: {rel}"
              p.write_text(t.replace(old, new), encoding="utf-8")
