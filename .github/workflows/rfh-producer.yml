            (p + q).coeff m = p.coeff m + q.coeff m := by
            simp only [AddMonoidAlgebra.coeff_add, Finsupp.add_apply]

          """
                      lines = old.splitlines(keepends=True)
                      i = 0
                      while i < len(lines) and (lines[i].startswith('import ') or not lines[i].strip()):
                          i += 1
                      lines.insert(i, helper)
                      old = ''.join(lines)
                  new = re.sub(r"(?<![\w.])coeff_add(?![\w'])", "rhCompatCoeffAdd", old)
