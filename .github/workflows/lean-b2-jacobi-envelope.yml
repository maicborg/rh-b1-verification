name: "B2 - exponential Jacobi envelope independent of twistK"
on:
  push:
    paths:
      - 'B2JacobiEnvelope.lean'
      - '.github/workflows/lean-b2-jacobi-envelope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        run: |
          lake update
          lake exe cache get
      - name: Kernel check
        run: |
          set -o pipefail
          lake env lean B2JacobiEnvelope.lean 2>&1 | tee /tmp/b2-envelope.log
          if grep -q sorryAx /tmp/b2-envelope.log; then exit 1; fi
      - name: No placeholders
        run: |
          if grep -nE '\b(sorry|admit|axiom)\b' B2JacobiEnvelope.lean; then exit 1; fi
