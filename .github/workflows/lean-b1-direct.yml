name: 'Lean B1 - prova autonoma del ponte (condizionale)'
on:
  push:
    paths:
      - 'B1Standalone.lean'
      - 'B1RationalGap.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - '.github/workflows/lean-b1-direct.yml'
  workflow_dispatch:

jobs:
  verify-bridge:
    name: 'Lean B1 standalone: bridge with explicit h78'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Lean toolchain via elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib dependencies and write manifest
        run: lake update
      - name: Download Mathlib build cache
        run: lake exe cache get
      - name: Check elementary rational gap
        run: lake env lean B1RationalGap.lean
      - name: Compile conditional B1 bridge
        run: lake env lean B1Standalone.lean
