      - name: Check RFHFinalLocal
        working-directory: upstream/lean
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFHFinalLocal.lean <<'LEAN'
          import RFHMatchedChain
          import Development.AutomorphicArithmetic.PrimitiveCosets.PrimRead
          import Development.AutomorphicArithmetic.PrimitiveCosets.PrimInj
          import Development.AutomorphicArithmetic.PrimitiveCosets.ToEBij
          import Development.AutomorphicArithmetic.PrimitiveCosets.hostFactsS
          import Formalism.SharpRestriction.RamificationFrobenius.TotientGaloisClasses.FrameFacts
          import Formalism.SizeWindowBrackets.ChainSlopeWindows.PChain
          open Finset UpperTheory.Top UpperTheory.Comparison₂ Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          def ZetaCoreWindows : Prop :=
            ∃ eD eL e1 : ℝ, 0 ≤ eD ∧ 0 ≤ eL ∧ 0 < e1 ∧
              ∀ eps : ℝ, 0 < eps → eps < e1 →
                ∃ K cHH eK : ℝ, ∀ Y0 : ℝ, ∃ Y : ℝ, Y0 ≤ Y ∧
                  ∀ x ∈ Set.Icc Y (Y ^ (3/2 : ℝ)),
                    ∃ (φ : Frame) (H : HostAx φ) (TT : Finset φ.A),
                      EAtH (Level.cyc PChar.one) H.toHostRaw TT x eps 4 ∧
                      CoreAtH H.toHostRaw TT eD eL K cHH eK eps x
          
          theorem singleton_kept : (Level.cyc PChar.one).KEPT = {PChar.one} := by
            classical
            ext ψ
            simp only [Finset.mem_singleton]
            constructor
            · intro hp
              change ψ ∈ (Level.ofSub (Subgroup.zpowers (1 : DirichletCharacter ℂ 1))).KEPT at hp
              obtain ⟨χ, _, hχ⟩ := (Level.mem_ofSub _ _).mp hp
              obtain rfl := DirichletCharacter.level_one χ
              exact hχ.symm.trans (PChar.of_one 1)
            · rintro rfl
              exact Level.mem_cyc PChar.one
          
          theorem singleton_order_one : (Level.cyc PChar.one).o = 1 := by
            change Nat.card ↥(Subgroup.zpowers (1 : DirichletCharacter ℂ 1)) = 1
            rw [Subgroup.zpowers_one_eq_bot]
            exact Nat.card_eq_one_iff_unique.2 ⟨inferInstance, inferInstance⟩
          
          theorem chr_eval (φ : Frame) (ψ : AddChar (E0 × φ.A) ℂ) (g : φ.GG) :
              ((chr φ ψ g : ℂˣ) : ℂ) = ψ (Multiplicative.toAdd (toE φ g)) := rfl
          
          theorem three_mode_trivial_nonzero (φ : Frame) (ψ : AddChar (E0 × φ.A) ℂ)
              (h : ψ = psC ∨ ψ = chC ∨ ψ = chpsC) :
              ψ ≠ 0 ∧ ∀ t : φ.A, ψ ((0 : E0),t) = 1 := by
            rcases h with rfl | rfl | rfl
            · constructor
              · intro hz
                have h := DFunLike.congr_fun hz (sg : E0 × φ.A)
                norm_num [psC,sg,AddChar.zero_apply] at h
              · intro t
                simp [psC]
            · constructor
              · intro hz
                have h := DFunLike.congr_fun hz (sgc0 : E0 × φ.A)
                norm_num [chC,sgc0,AddChar.zero_apply] at h
              · intro t
                simp [chC]
            · constructor
              · intro hz
                have h := DFunLike.congr_fun hz (sgc0 : E0 × φ.A)
                norm_num [chpsC,AddChar.mul_apply,psC,chC,sgc0,AddChar.zero_apply] at h
              · intro t
                simp [chpsC,AddChar.mul_apply,psC,chC]
          
          theorem bounded_of_nonzero_trivial (φ : Frame) (H : HostAx φ)
              (ψ : AddChar (E0 × φ.A) ℂ) (hne : ψ ≠ 0)
              (ht : ∀ t : φ.A, ψ ((0 : E0),t) = 1)
              (hsg : ψ (sgc0 : E0 × φ.A) = 1 ∨ ψ sgc0 = -1) :
              chr φ ψ ∈ H.toHostRaw.Bounded (Level.cyc PChar.one).KEPT := by
            have hT : Frame.TrivialOnFirstFactor (chr φ ψ) := by
              intro s hs
              apply Units.ext
              rw [Units.val_one,chr_eval,(toE_bij φ).2.2.2.1]
              exact ht s
            have hnk : ¬ H.toHostRaw.Kept (Level.cyc PChar.one).KEPT (chr φ ψ) := by
              intro hk
              have hp := (HostRaw.kept_iff _ _ _).1 hk
              rw [singleton_kept,Finset.mem_singleton] at hp
              have heq : chr φ ψ = 1 :=
                (prim_inj φ H).1 (hp.trans (prim_inj φ H).2.symm)
              apply hne
              rw [AddChar.eq_zero_iff]
              intro a
              obtain ⟨g,hg⟩ := (toE_bij φ).1.2 (Multiplicative.ofAdd a)
              have h := chr_eval φ ψ g
              rw [heq,MonoidHom.one_apply,Units.val_one,hg] at h
              exact h.symm
            have hEval : ((chr φ ψ φ.iod : ℂˣ) : ℂ) = ψ sgc0 := by
              rw [chr_eval,(toE_bij φ).2.1]
              rfl
            rcases hsg with h1 | h2
            · exact Or.inl ⟨⟨hT,Units.ext (hEval.trans h1)⟩,hnk⟩
            · exact Or.inr ⟨hT,Units.ext (hEval.trans h2)⟩
          
          
          end BorghettiRH
          #print axioms BorghettiRH.singleton_kept
          #print axioms BorghettiRH.singleton_order_one
          #print axioms BorghettiRH.chr_eval
          #print axioms BorghettiRH.three_mode_trivial_nonzero
          #print axioms BorghettiRH.bounded_of_nonzero_trivial
          LEAN
          lake env lean -o RFHFinalLocal.olean RFHFinalLocal.lean 2>&1 | tee ../../bridge/assembly-logs/RFHFinalLocal.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('../../bridge/assembly-logs/RFHFinalLocal.log').read_text()
          for n in ["singleton_kept","singleton_order_one","chr_eval","three_mode_trivial_nonzero","bounded_of_nonzero_trivial"]:
              m = re.search(r'BorghettiRH\.'+n+r"' depends on axioms:\s*\[([^\]]*)\]",s)
              assert m,n
              assert {x.strip() for x in m.group(1).split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in s
          PY
      - name: Check RFHFinalValues
        working-directory: upstream/lean
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFHFinalValues.lean <<'LEAN'
          import RFHFinalLocal
          open Finset UpperTheory.Top UpperTheory.Comparison₂ Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          theorem singleton_values (φ : Frame) (H : HostAx φ)
              (TT : Finset φ.A) (x eps : ℝ) (ell : AddChar (E0 × φ.A) ℂ → ℂ)
              (hE : EAtH (Level.cyc PChar.one) H.toHostRaw TT x eps 4)
              (hell : HostAddCharCompatible H.toHostRaw ell) :
              ValuesAtX (arith H.toHostRaw) ell x eps 4 := by
            intro ψ hψ
            obtain ⟨hne,ht⟩ := three_mode_trivial_nonzero φ ψ hψ
            have hs : ψ (sgc0 : E0 × φ.A) = 1 ∨ ψ sgc0 = -1 := by
              rcases hψ with rfl | rfl | rfl
              · left; simp [psC,sgc0]
              · right; norm_num [chC,sgc0]
              · right; norm_num [chpsC,AddChar.mul_apply,chC,psC,sgc0]
            have hb := bounded_of_nonzero_trivial φ H ψ hne ht hs
            let p := H.toHostRaw.prim (chr φ ψ)
            haveI := p.ne
            have hp : H.toHostRaw.IsPrimOf (chr φ ψ) p.χ := H.toHostRaw.isPrimOf_prim _
            have hr := prim_read φ H ell hell ψ
            constructor
            · rw [hr.2 x]
              exact hE.bdG _ hb _ _ hp
            · rw [hr.1 hne]
              exact hE.bdL _ hb _ _ hp
          
          
          end BorghettiRH
          #print axioms BorghettiRH.singleton_values
          LEAN
          lake env lean -o RFHFinalValues.olean RFHFinalValues.lean 2>&1 | tee ../../bridge/assembly-logs/RFHFinalValues.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('../../bridge/assembly-logs/RFHFinalValues.log').read_text()
          for n in ["singleton_values"]:
