            exact producer_vwin PChar.one
          
          #print axioms BorghettiRH.producer_vwin
          #print axioms BorghettiRH.producer_vwin_zeta
          end BorghettiRH
          LEAN
          lake env lean -o RFHVWin.olean RFHVWin.lean 2>&1 | tee ../../bridge/assembly-logs/producer-vwin.log
      - name: Final theorem and transitive dependency audit
        working-directory: upstream/lean
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFHFinal.lean <<'LEAN'
          import RFHFinalZeta
          import RFHVWin
          import Development.AutomorphicArithmetic.ThetaCorrespondence.ThetaPairLifts.ThirdPlaceSeries.EveryCharacterOfLiteratureOfVWin
          import Lean.Util.FoldConsts
          namespace BorghettiRH
          theorem rfh_final : RiemannHypothesis :=
            rfh_of_zeta_core_windows (zeta_core_windows_of_topG producer_topG producer_vwin_zeta)
          end BorghettiRH
          #print axioms BorghettiRH.rfh_final
          open Lean Elab Command
          set_option maxHeartbeats 0 in
          run_cmd do
            let env ← getEnv
            let mut seen : Std.HashSet Name := {}
            let mut todo : Array Name := #[``BorghettiRH.rfh_final]
            let required : List Name := [
              ``BorghettiRH.rfh_of_zeta_core_windows,
              ``BorghettiRH.rfh_of_matched_core_windows,
              ``BorghettiRH.normalized_point_of_matched_core,
              ``BorghettiRH.rh_of_zeta_windows,
              ``BorghettiRH.zeta_core_windows_of_topG,
              ``BorghettiRH.producer_topG,
              ``BorghettiRH.producer_vwin_zeta,
              ``UpperTheory.Top.supplyChi,
              ``QH.pairEx,
              ``BorghettiRH.b2_actual_h78,
              ``OAI.DirichletCharacter.LFunction_ne_zero_of_seven_eighths_lt_re]
            while !todo.isEmpty do
              let n := todo.back!
              todo := todo.pop
              if seen.contains n then continue
              seen := seen.insert n
              let ns := n.toString
              if ns.startsWith "UpperTheory.FinalTheorems." ||
                 ns == "UpperTheory.Top.zeroFreeAll_of_topG" ||
                 ns == "UpperTheory.LiteratureTheorems.every_character_of_literature_of_vWin" ||
                 ns == "UpperTheory.Top.zero_free_all_of_green_v_win" ||
                 ns == "UpperTheory.Top.every_character_of_green_v_win" then
                throwError m!"Forbidden terminal dependency {n}"
              if let some ci := env.find? n then
                if let some v := ci.value? (allowOpaque := true) then
                  for dep in v.getUsedConstants do
                    if !seen.contains dep then todo := todo.push dep
            for n in required do
              unless seen.contains n do throwError m!"Missing transitive dependency {n}"
              logInfo m!"VERIFIED_FINAL_DEP {n}"
            logInfo m!"AUDITED_CLOSURE {seen.size}"
          
          LEAN
          lake env lean RFHFinal.lean 2>&1 | tee ../../bridge/assembly-logs/final.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('../../bridge/assembly-logs/final.log').read_text()
          m=re.search(r"BorghettiRH\.rfh_final' depends on axioms:\s*\[([^\]]*)\]",log)
          assert m
          assert {x.strip() for x in m.group(1).split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in log and log.count('VERIFIED_FINAL_DEP') == 11 and 'AUDITED_CLOSURE' in log
          PY
