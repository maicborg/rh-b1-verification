          ]
          # Limit changes to files with the old coefficient lemma in the failed closure.
          coeff_names = {"LNondomLemmas.lean", "LGradedLemmas.lean", "FockPerm.lean",
              "LRowstLemmas.lean", "LCcompLemmas.lean", "LCpleadLemmas.lean",
              "FockDiagBound.lean", "LeadInterlaced.lean", "LHwinLemmas.lean",
              "PeelHomog.lean", "LinSubstIsHomogeneous.lean"}
          for root in coeff_roots:
              for p in root.glob("*.lean"):
                  if p.name not in coeff_names:
                      continue
                  old = p.read_text(encoding="utf-8")
                  if p.name == "FockPerm.lean":
                      helper = """private theorem rhCompatCoeffAdd {R σ : Type*} [CommSemiring R]
