          private theorem rhCompatCoeffAdd {R σ : Type*} [CommSemiring R]
            (m : σ →₀ ℕ) (p q : MvPolynomial σ R) :
            rhCompatCoeff m (p + q) = rhCompatCoeff m p + rhCompatCoeff m q := by
            change (p + q).coeff m = p.coeff m + q.coeff m
            simp only [AddMonoidAlgebra.coeff_add, Finsupp.add_apply]

          private theorem rhCompatCoeffZero {R σ : Type*} [CommSemiring R]
            (m : σ →₀ ℕ) : AddMonoidAlgebra.coeff (0 : MvPolynomial σ R) m = 0 := by
            simp

          """
              lines.insert(i, compat)
              p.write_text(''.join(lines), encoding='utf-8')
              print('Gate3A coefficient compatibility:', rel)
          PY
          python3 - <<'PY'
          from pathlib import Path
          edits = [["Formalism/GL3MeanSquares/ModelCocycleExponent.lean","PowerSeries.derivative K","PowerSeries.derivative (R := K)",2],["Formalism/QuotientMetricDivisors/HermitianTwistDivisors/DeterminantCauchySchwarz.lean","Finset.prod_le_prod (fun _ _ => zero_le_one)","Finset.prod_le_prod₀ (fun _ _ => zero_le_one)",1],["Development/AbelianVarietyTheory/Proofs/GlobalInterpolation/ExistsInterpolationExteriorSmallCoeffs.lean","Finset.prod_le_one (fun i _ => norm_nonneg _)","Finset.prod_le_one₀ (fun i _ => norm_nonneg _)",1],["Development/AbelianVarietyTheory/Proofs/GlobalInterpolation/ChoiceOfTops.lean","exact prod_le_one (fun c' _ => (hind c' _).1)","exact prod_le_one₀ (fun c' _ => (hind c' _).1)",1],["Development/AbelianVarietyTheory/Proofs/GlobalInterpolation/ChoiceOfTops.lean","refine prod_le_prod (fun c' _ => ?_)","refine prod_le_prod₀ (fun c' _ => ?_)",1],["Development/AbelianVarietyTheory/Proofs/GlobalInterpolation/ChoiceOfTops.lean","refine prod_le_prod (fun j _ => ?_)","refine prod_le_prod₀ (fun j _ => ?_)",1],["Formalism/GradedWeylDivisibility/FockSpaceTableaux/RowDivStable.lean","conv => enter [2, 1, 2]; rw [f.as_sum]","nth_rewrite 1 [f.as_sum]",1],["Formalism/GradedWeylDivisibility/FockSpaceTableaux/LHwinLemmas.lean","conv => enter [2, 1, 2]; rw [f.as_sum]","nth_rewrite 1 [f.as_sum]",1]]
          for rel, old, new, count in edits:
