name: RFH | Final assembly UNO DUE TRE
on:
  push:
    branches: [assembly/uno-due-tre-v2]
    paths: [.github/workflows/rfh-final-assembly.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rfh-final-assembly
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 4eaee87548250b2682affda7d05d947c05554bae
          path: upstream
          filter: blob:none
          sparse-checkout: lean
      - uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: src
      - name: Assemble pinned sources
        shell: bash
        run: |
          set -euo pipefail
          for folder in BuildAid CompanionTheory Development Formalism GroundTheory Lemmata PositivityTheory ReciprocityTheory Supplements; do
            cp -a "alpoge/src/$folder" "upstream/lean/$folder"
          done
          cat >> upstream/lean/lakefile.lean <<'EOF'
          lean_lib BuildAid where globs := #[`BuildAid.+]
          lean_lib CompanionTheory where globs := #[`CompanionTheory.+]
          lean_lib Development where globs := #[`Development.+]
          lean_lib Formalism where globs := #[`Formalism.+]
          lean_lib GroundTheory where globs := #[`GroundTheory.+]
          lean_lib Lemmata where globs := #[`Lemmata.+]
          lean_lib PositivityTheory where globs := #[`PositivityTheory.+]
          lean_lib ReciprocityTheory where globs := #[`ReciprocityTheory.+]
          lean_lib Supplements where globs := #[`Supplements.+]
          EOF
          mkdir -p upstream/lean/Development/AutomorphicArithmetic/MeanSquareBounds
          cp bridge/B2*.lean upstream/lean/Development/AutomorphicArithmetic/MeanSquareBounds/
          python3 bridge/ci/b2_prepare.py --root upstream/lean --bridge bridge --mode apply
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/lean/Development/AutomorphicArithmetic/DedekindLFunctions/LandauTheorems/mellinGchiOfNeOne.lean')
          s = p.read_text(encoding='utf-8')
          for old, new in [["      convert h1 using 1\n      · rfl\n      · ext m\n        simp only [F, ha]\n        ring\n      · simp","      convert h1 using 1\n      · funext m\n        simp only [F, ha]\n        ring\n      · simp"],["    convert h1 using 1\n    · rfl\n    · ext m\n      simp only [F]\n      rw [integral_const_mul, mellin_ramp (m + 1) (by omega) s hs,\n        LSeries.term_of_ne_zero (by omega), cpow_neg]\n      ring\n    · simp [LSeries]","    convert h1 using 1\n    · funext m\n      simp only [F]\n      rw [integral_const_mul, mellin_ramp (m + 1) (by omega) s hs,\n        LSeries.term_of_ne_zero (by omega), cpow_neg]\n      ring\n    · simp [LSeries]"]]:
              if s.count(old) != 1:
                  raise SystemExit('Unexpected pinned Mellin proof block')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Mellin compatibility: two exact tactic blocks patched; statements unchanged')
          PY
          python3 - <<'PY'
          from pathlib import Path
          for rel, old, new, count in [["Formalism/TameInertiaTowers/StatementGroup.lean","(powMonoidHom 2 : (GalL n ⧸ Subgroup.zpowers (JJ n)) →* _).range","(powMonoidHom (α := GalL n ⧸ Subgroup.zpowers (JJ n)) 2).range",2],["ReciprocityTheory/GaloisValuations/GlobalB.lean","Ideal.isMaximal_of_isIntegral_of_isMaximal_comap (R := 𝓞 F) Q","Ideal.isMaximal_of_isIntegral_of_isMaximal_under (R := 𝓞 F) Q",1],["ReciprocityTheory/GaloisValuations/GlobalB.lean","    (by rw [show Ideal.comap (algebraMap (𝓞 F) (IntCl F Ω)) Q = v.asIdeal from\n      under_primeBelow hA]; exact v.isMaximal)","    (by\n      rw [hQ, under_primeBelow hA]\n      exact v.isMaximal)",1]]:
              p = Path('upstream/lean') / rel
              s = p.read_text(encoding='utf-8')
              if s.count(old) != count:
                  raise SystemExit('Unexpected pinned compatibility block: ' + rel)
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('Compatibility patch:', rel)
          PY
          python3 - <<'PY'
          from pathlib import Path
          d = Path("upstream/lean/Development/AutomorphicArithmetic/CharacterBoxes")
          p = d / 'ExistsPageN.lean'
          q = d / 'PairGood.lean'
          s = p.read_text(encoding='utf-8')
          t = q.read_text(encoding='utf-8')
          block = "structure WinPair (eps Y : ℝ) (q d : ℕ) : Prop where\n  q_prime : q.Prime\n  q_mod : q % 8 = 3\n  q_lo : Y ^ (eps / 5) / 2 < Real.log q\n  q_up : Real.log q ≤ Y ^ (eps / 5)\n  d_prime : d.Prime\n  d_mod : d % 16 = 7\n  d_lo : Y ^ (eps / 5) * Real.log Y ^ 2 / 2 < Real.log d\n  d_up : Real.log d ≤ Y ^ (eps / 5) * Real.log Y ^ 2\n  d_q : q ∣ d + 1\n  d_small : ∀ p : ℕ, p.Prime → p ≠ 2 → (p : ℝ) ≤ Y ^ (eps / 5) → p ∣ d + 1\n"
          assert s.count(block) == 1
          old = 'import Development.AutomorphicArithmetic.CharacterBoxes.ExistsPageN\n'
          assert t.count(old) == 1
          new = 'import Development.AutomorphicArithmetic.CharacterBoxes.WinPairArithmetic\n'
          head = 'import Formalism.SharpRestriction.RamificationFrobenius.TotientGaloisClasses.ExplicitFormulaErrorOfHostConditions\n\nnoncomputable section\n\nnamespace UpperTheory.Top\n\nopen Formalism.HC\n\n'
          (d / 'WinPairArithmetic.lean').write_text(head + block + '\nend UpperTheory.Top\n\nend\n', encoding='utf-8')
          p.write_text(new + s.replace(block, ''), encoding='utf-8')
          q.write_text(t.replace(old, new), encoding='utf-8')
          print('WinPair extracted verbatim; original qualified declaration name retained; cohomology not patched')
          PY
          mkdir -p bridge/assembly-logs
          cp bridge/RHAssemblyV2.lean upstream/lean/RHAssemblyV2.lean
      - name: Install Lean
        working-directory: upstream/lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and Mathlib cache
        working-directory: upstream/lean
        timeout-minutes: 45
        run: |
          lake update
          lake exe cache get
          lean --version
      - name: Restore compatible compiled modules
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: upstream/lean/.lake/build
          key: rfh-final-assembly-4341-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rfh-zeta-core-windows-4341-${{ runner.os }}-
            rfh-gate3a-two-frontier-4341-${{ runner.os }}-45624241466
            rfh-123-matched-core-4341-${{ runner.os }}-45624416167
            rfh-due-size-microtests-4341-${{ runner.os }}-45620331733
            rh-assembly-v2-4341-${{ runner.os }}-integrated-45610235193
      - name: Gate 3A | restore geometric imports and elaborate cokernel
        working-directory: upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Development/AutomorphicArithmetic/CharacterBoxes/TwistForm.lean')
          s = p.read_text(encoding='utf-8')
          old = 'import Development.AutomorphicArithmetic.CharacterBoxes.PairGood\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + 'import Development.AutomorphicArithmetic.CharacterBoxes.ExistsPageN\n', 1), encoding='utf-8')
          p = Path('Formalism/GaloisCohomology/Statement.lean')
          s = p.read_text(encoding='utf-8')
          old = '''def PTCokerAt (D : LData F Ω l) (e : ℤ) : Prop :=
            PTCase F l →
              Module.length ℤ_[l] ((∀ v : D.S, H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) ⧸
                  LinearMap.range (localH2 D e)) =
                Module.length ℤ_[l] (H0 (qzTw D e))'''
          new = '''set_option backward.isDefEq.respectTransparency false in
          def PTCokerAt (D : LData F Ω l) (e : ℤ) : Prop := by
            letI : ∀ v : D.S, AddCommGroup (H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) :=
              fun v => inferInstance
            letI : ∀ v : D.S, Module ℤ_[l] (H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) :=
              fun v => inferInstance
            letI : AddCommGroup (∀ v : D.S, H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) :=
              Pi.addCommGroup
            letI : Module ℤ_[l] (∀ v : D.S, H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) :=
              Pi.module _ _ _
            exact PTCase F l →
              Module.length ℤ_[l] ((∀ v : D.S, H2 ((zlTw D (e + 1)).comp (locFam D.S D.A v))) ⧸
                  LinearMap.range (localH2 D e)) =
                Module.length ℤ_[l] (H0 (qzTw D e))'''
          assert s.count(old) == 1, 'Unexpected pinned PTCokerAt block'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply verified historical compatibility patches
        working-directory: upstream/lean
        timeout-minutes: 115
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          patches = [["Formalism/CMTypeGalois/CMTypeFrobenius/HostConj.lean","by convert hmq'; exact Subsingleton.elim _ _","by convert hmq' <;> exact Subsingleton.elim _ _"],["Formalism/CMTypeGalois/CMTypeFrobenius/HostConj.lean","      convert this using 1\n      norm_num","      convert this using 1 <;> norm_num"],["Formalism/LatticeTheta/LatticeThetaProofs/LatticeSummableDecay.lean","AddSubgroup.isClosed_of_discrete (H := L.toAddSubgroup)","AddSubgroup.isClosed_of_discrete (U := L.toAddSubgroup)"],["Formalism/SuccessiveMinima/SuccessiveMinimaProofs/AdaptedBasis.lean","AddSubgroup.isClosed_of_discrete (H := L.toAddSubgroup)","AddSubgroup.isClosed_of_discrete (U := L.toAddSubgroup)"],["Formalism/LatticeSlopes/LatticeSlopesProofs/FiniteSaturated.lean","AddSubgroup.isClosed_of_discrete (H := L.toAddSubgroup)","AddSubgroup.isClosed_of_discrete (U := L.toAddSubgroup)"],["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/Ipindep.lean","(DoubleCoset.eq _ _ (s c) (s' c)).1","DoubleCoset.eq.mp"],["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/Heckebasic.lean","(DoubleCoset.eq K K g (Quotient.out (DoubleCoset.mk K K g))).1","DoubleCoset.eq.mp"],["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/Heckebasic.lean","(DoubleCoset.eq K K s (Quotient.out c)).2","DoubleCoset.eq.mpr"],["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/Heckebasic.lean","(DoubleCoset.eq K K g ((a : G) * g * b)).2","DoubleCoset.eq.mpr"],["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/Heckebasic.lean","(DoubleCoset.eq K K (Quotient.out (DoubleCoset.mk K K g)) g).1","DoubleCoset.eq.mp"],["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/AutomorphicFormsDecompositionHolds.lean","(DoubleCoset.eq Γ K (s (DoubleCoset.mk Γ K g)) g).1","DoubleCoset.eq.mp"],["Formalism/HermitianLattices/HermitianLatticesProofs/ThetaSummable.lean","Finset.prod_le_prod (fun i _ => Finset.sum_nonneg","Finset.prod_le_prod₀ (fun i _ => Finset.sum_nonneg"],["Formalism/HermitianLattices/HermitianLatticesProofs/ThetaSummable.lean","        refine (hPSD.dotProduct_mulVec_zero_iff v).mp ?_\n        rw [star_trivial]\n        exact heq.symm","        exact hPSD.dotProduct_mulVec_zero_iff.mp (by simpa only [star_trivial] using heq.symm)"],["Formalism/GL3MeanSquares/HookFormulaTorsion/HadamardUnitDiagonalDetLeOne.lean","Finset.prod_le_prod (fun i _ => hnn i)","Finset.prod_le_prod₀ (fun i _ => hnn i)"],["Formalism/GL3MeanSquares/HookFormulaTorsion/HadamardUnitDiagonalDetLeOne.lean","(hG.dotProduct_mulVec_zero_iff _).mp","hG.dotProduct_mulVec_zero_iff.mp"],["Formalism/GL3MeanSquares/HookFormulaTorsion/HadamardUnitDiagonalDetLeOne.lean","Finset.prod_le_one (fun c _ => hcol0 c)","Finset.prod_le_one₀ (fun c _ => hcol0 c)"],["Formalism/TameInertiaTowers/CentralOrderTwo/Groups.lean","Finset.prod_le_prod (fun _ _ => Nat.zero_le _) (fun i _ => hfin i)","Finset.prod_le_prod (fun i _ => hfin i)"],["Formalism/RealPlaceAnalysis/RealPlaceTaylor/ProdFactorialSupportSubSingle.lean","simp only [coeff_add]","simp only [AddMonoidAlgebra.coeff_add, Pi.add_apply]"],["Formalism/RealPlaceAnalysis/RealPlaceTaylor/ProdFactorialSupportSubSingle.lean","simp only [coeff_add, star_add]","simp only [AddMonoidAlgebra.coeff_add, Pi.add_apply, star_add]"],["Formalism/GradedWeylDivisibility/StatementC.lean","(coeff m g)","(g.coeff m)"]]
          for rel, old, new in patches:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              assert s.count(old) == 1, f'Unexpected compatibility block: {rel}'
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Gate3A API compatibility:', rel)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          edits = [["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/Heckebasic.lean","DoubleCoset.eq.mp\n    (DoubleCoset.out_eq' K K _).symm","(DoubleCoset.eq (H := K) (K := K) (a := g) (b := Quotient.out (DoubleCoset.mk K K g))).mp\n    (DoubleCoset.out_eq' _).symm"],["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/Heckebasic.lean","(DoubleCoset.eq.mpr ⟨a, a.2, b, b.2, e⟩).trans\n      (DoubleCoset.out_eq' K K c)","((DoubleCoset.eq (H := K) (K := K) (a := s) (b := Quotient.out c)).mpr ⟨a, a.2, b, b.2, e⟩).trans\n      (DoubleCoset.out_eq' c)"],["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/Heckebasic.lean","(DoubleCoset.eq.mpr ⟨a, a.2, b, b.2, rfl⟩).symm","((DoubleCoset.eq (H := K) (K := K) (a := g) (b := (a : G) * g * b)).mpr ⟨a, a.2, b, b.2, rfl⟩).symm"],["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/Heckebasic.lean","DoubleCoset.eq.mp\n        (DoubleCoset.out_eq' K K (DoubleCoset.mk K K g))","(DoubleCoset.eq (H := K) (K := K) (a := Quotient.out (DoubleCoset.mk K K g)) (b := g)).mp\n        (DoubleCoset.out_eq' (DoubleCoset.mk K K g))"],["Formalism/SatakeDualWeyl/AdelicIwasawaHecke/AutomorphicFormsDecompositionHolds.lean","have h := DoubleCoset.eq.mp (hs _)","have h := (DoubleCoset.eq (H := Γ) (K := K) (a := s (DoubleCoset.mk Γ K g)) (b := g)).mp (hs (DoubleCoset.mk Γ K g))"],["Formalism/RealPlaceAnalysis/RealPlaceTaylor/ProdFactorialSupportSubSingle.lean","AddMonoidAlgebra.coeff_add, Pi.add_apply","MvPolynomial.coeff_add"],["Formalism/FormalGroupLog/Statement.lean","MvPowerSeries.pderiv K i","MvPowerSeries.pderiv (R := K) i"],["Formalism/SharpRestriction/LevelLetterCocycles/DataNLoc.lean","PowerSeries.derivative LL E","PowerSeries.derivative (R := LL) E"],["Formalism/TameInertiaTowers/CentralOrderTwo/NegOneNeOneUnitsZmodFour.lean","noncomputable def eGamE","set_option maxHeartbeats 2000000 in\nnoncomputable def eGamE"]]
          for rel, old, new in edits:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              assert s.count(old) == (2 if rel.endswith('ProdFactorialSupportSubSingle.lean') else 1), f'Unexpected second compatibility block: {rel}'
              p.write_text(s.replace(old, new), encoding='utf-8')
          coeff_files = ["Formalism/GradedWeylDivisibility/FockSpaceTableaux/LRowstLemmas.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LNondomLemmas.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LCdegLemmas.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LCpleadLemmas.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LCcompLemmas.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/RowDivStable.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LeadInterlaced.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LHwinLemmas.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LGradedLemmas.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/PeelHomog.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/PeelDecomp.lean","Formalism/SatakeDualWeyl/AdelicIwasawaHecke/LinSubstIsHomogeneous.lean","Formalism/FockGram/StatementFock.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/FockDiagBound.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/PeelLead.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/NablaTallZero.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LHwlineLemmas.lean","Formalism/SatakeDualWeyl/AdelicIwasawaHecke/DualWeylModuleStable.lean","Formalism/SatakeDualWeyl/AdelicIwasawaHecke/Wlocal.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/HWLine.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LDbasisLemmas.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LDrowLemmas.lean","Formalism/GradedWeylDivisibility/FockSpaceTableaux/LDlatLemmas.lean"]
          for rel in coeff_files:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              # Restore the former coefficient argument order using a reducible alias.
              # Preserve the two partial applications and the named-argument generalize.
              if rel.endswith(("LNondomLemmas.lean", "Wlocal.lean", "LDlatLemmas.lean")):
                  assert s.count("congrArg (coeff m)") == 1
                  s = s.replace("congrArg (coeff m)", "congrArg (fun p => AddMonoidAlgebra.coeff p m)")
              if rel.endswith("LDbasisLemmas.lean"):
                  old = "congrArg (MvPolynomial.coeff (o.degree (v j)))"
