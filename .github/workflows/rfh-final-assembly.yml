              assert m,n
              assert {x.strip() for x in m.group(1).split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in s
          PY
      - name: Check RFHFinalPack
        working-directory: upstream/lean
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFHFinalPack.lean <<'LEAN'
          import RFHFinalValues
          open Finset UpperTheory.Top UpperTheory.Comparison₂ Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          set_option maxHeartbeats 3000000 in
          theorem matched_of_core_at_host
              (eD eL K cHH eK Cd eps x : ℝ) (φ : Frame) (H : HostAx φ) (TT : Finset φ.A)
              (hE : EAtH (Level.cyc PChar.one) H.toHostRaw TT x eps 4)
              (hCore : CoreAtH H.toHostRaw TT eD eL K cHH eK eps x)
              (hCd : 0 ≤ Cd)
              (hDer : ∀ (A : Type) [AddCommGroup A] [Fintype A] [DecidableEq A]
                  (D : ArithData A) (ell : AddChar (E0 × A) ℂ → ℂ), DerivInt D ell Cd)
              (hX : XLarge K cHH eK Cd 4 eps x) :
              MatchedCorePoint (eD+eL+3) eps x := by
            obtain ⟨U,iU,tr,W,iW,iNW,Top,iT,m,f,Dd,C,Xpp,ell,N,T2,a,w,eT,eP,η,X',θ,
              hell,hxx,he,hD,hL,hHH,hcov,hId,hSize,hWin,hBN,hSz,hThin,hCost,hRest,hT2⟩ := hCore
            subst x
            subst eps
            have hi : φ.A0.index = 1 := φ.index_A0_eq_o.trans (hE.o_eq.trans singleton_order_one)
            have hB : CErr C ≤ eD+eL+3 := by unfold CErr; linarith
            obtain ⟨h3,h26,hLarge,hMove⟩ := hX
            have hlarge : LargeX Dd.x Dd.ε K C.cHH eK := by
              have hh := hWin
              unfold ErrWindows ErrWindows0 ConstsBound at hh
              have heK : 0 ≤ eK := by tauto
              refine ⟨hLarge.1,le_trans ?_ hLarge.2⟩
              unfold KBig
              exact mul_le_mul_of_nonneg_right
                (mul_le_mul_of_nonneg_left (by linarith) (by positivity)) (by linarith)
            have hV := singleton_values φ H TT Dd.x Dd.ε ell hE hell
            have hHost := hostFactsS φ H
            have hSmall : SmallCosts Dd.x Dd.ε (fPl φ.A) Dd.b η θ Cd 4 :=
              ⟨hMove,hCost.1,hCost.2⟩
            exact ⟨φ.A,inferInstance,inferInstance,inferInstance,U,iU,W,iW,iNW,Top,iT,m,f,Dd,tr,φ.A0,C,Xpp,eK,K,
              arith H.toHostRaw,insert H.q H.small,ell,N,TT,T2,a,w,eT,eP,η,X',θ,Cd,4,
              rfl,rfl,hB,hi,hcov,hHost,hId,hSize,hWin,hBN,hlarge,hRest,h3,h26,hSz,hThin,hCd,
              hDer φ.A (arith H.toHostRaw) ell,hV,hSmall⟩
          
          
          end BorghettiRH
          #print axioms BorghettiRH.matched_of_core_at_host
          LEAN
          lake env lean -o RFHFinalPack.olean RFHFinalPack.lean 2>&1 | tee ../../bridge/assembly-logs/RFHFinalPack.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('../../bridge/assembly-logs/RFHFinalPack.log').read_text()
          for n in ["matched_of_core_at_host"]:
              m = re.search(r'BorghettiRH\.'+n+r"' depends on axioms:\s*\[([^\]]*)\]",s)
              assert m,n
              assert {x.strip() for x in m.group(1).split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in s
          PY
      - name: Check RFHFinalConditional
