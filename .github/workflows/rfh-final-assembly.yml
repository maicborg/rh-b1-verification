      - name: Check RFHFinalZeta
        working-directory: upstream/lean
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          cat > RFHFinalZeta.lean <<'LEAN'
          import RFHFinalConditional
          import Development.AutomorphicArithmetic.CharacterBoxes.ZeroFreeAllOfTopG
          import Development.AutomorphicArithmetic.CharacterBoxes.SupplyChi
          open Finset UpperTheory.Top UpperTheory.Comparison₂ Formalism Formalism.D5 Formalism.HC Formalism.RankGapBounds.WeightedMeanData Formalism.LFunctionChainParameters.WeightedSlopeBounds Formalism.LFunctionChainParameters.characterSumData Formalism.LFunctionChainParameters.ThickSetMeanBounds Formalism.LFunctionChainParameters.LErr Formalism.LFunctionChainParameters.LChain Deduction.CH
          noncomputable section
          namespace BorghettiRH
          open GlobalTheory.EX
          theorem core_relax {φ : Frame} {H : HostRaw φ} {TT : Finset φ.A}
              {eD eL K cHH eK eps x : ℝ}
              (h : CoreAtH H TT eD eL K cHH eK eps x) :
              CoreAtH H TT (max eD 0) (max eL 0) K cHH eK eps x := by
            obtain ⟨U,iU,tr,W,iW,iNW,Top,iT,m,f,Dd,C,Xpp,ell,N,T2,a,w,eT,eP,η,X',θ,
              hell,hx,he,hD,hL,hHH,hcov,hId,hSize,hWin,hBN,hSz,hThin,hCost,hRest,hT2⟩ := h
            exact ⟨U,iU,tr,W,iW,iNW,Top,iT,m,f,Dd,C,Xpp,ell,N,T2,a,w,eT,eP,η,X',θ,
              hell,hx,he,hD.trans (le_max_left _ _),hL.trans (le_max_left _ _),hHH,hcov,hId,hSize,hWin,hBN,hSz,hThin,hCost,hRest,hT2⟩
          
          set_option maxHeartbeats 2000000 in
          theorem zeta_core_windows_of_topG (hTop : TopG) (hV : VWinAt PChar.one 401) :
              ZetaCoreWindows := by
            obtain ⟨eD,eL,e1,h1,h⟩ := hTop (3/2) (GChi PChar.one) (by norm_num)
              (supplyChi PChar.one hV) (hypV_of_cls PChar.one (3/2))
            refine ⟨max eD 0,max eL 0,e1,le_max_right _ _,le_max_right _ _,h1,?_⟩
            intro eps he he1
            obtain ⟨Fm,c,K,cHH,eK,CL,x0,hT⟩ := h eps he he1
            refine ⟨K,cHH,eK,?_⟩
            intro Y0
            have hw : HasWindows Fm.Win (3/2) := (windows_iff Fm.toFamCore (3/2)).1 c.1
            obtain ⟨Y,hY,hwin⟩ := hw (max Y0 (max x0 (Fm.x1+1)))
            refine ⟨Y,(le_max_left _ _).trans hY,?_⟩
            intro x hx
            have hx0 : x0 ≤ x := (le_max_left x0 (Fm.x1+1)).trans ((le_max_right Y0 _).trans (hY.trans hx.1))
            have hxE : Fm.x1+1 ≤ x := (le_max_right x0 (Fm.x1+1)).trans ((le_max_right Y0 _).trans (hY.trans hx.1))
            obtain ⟨i,hi⟩ := tiedCore_of_chainTied Fm eD eL K cHH eK CL x (hT x hx0 (hwin x hx.1 hx.2))
            have hE := (c.2 x (by linarith) i).1
            rw [Fm.L_x x i (by linarith), Fm.L_eps x i] at hE
            exact ⟨_,(Fm.D x i).host.toHostAx, (Fm.D x i).host.TT,hE,core_relax hi⟩
          
          
          end BorghettiRH
          #print axioms BorghettiRH.core_relax
          #print axioms BorghettiRH.zeta_core_windows_of_topG
          LEAN
          lake env lean -o RFHFinalZeta.olean RFHFinalZeta.lean 2>&1 | tee ../../bridge/assembly-logs/RFHFinalZeta.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('../../bridge/assembly-logs/RFHFinalZeta.log').read_text()
          for n in ["core_relax","zeta_core_windows_of_topG"]:
              m = re.search(r'BorghettiRH\.'+n+r"' depends on axioms:\s*\[([^\]]*)\]",s)
              assert m,n
              assert {x.strip() for x in m.group(1).split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in s
          PY
      - name: Producer | prepare preterminal TopG extraction
        working-directory: upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          cat > RFHTopGBody.lean <<'LEAN'
          namespace BorghettiRH
          open Formalism.BasicNotions Formalism.MainNotions GlobalTheory.Fc
          open UpperTheory.LiteratureTheorems
          
          theorem topG_of_literature (O : OpenLiteratureStatements) : UpperTheory.Top.TopG := by
            let P := published_results_eigen O
            let F := published_results_first O
            have hAM := theta_integrals_agree_and_local_matching_of_literature O
            have hX := (_root_.SelfIntersectionVolumeEstimates.topCovolSlim2_use_alt_alt (_root_.UpperTheory.LiteratureTheorems.resolution_char_zero_of_literature O) (_root_.UpperTheory.LiteratureTheorems.principalisation_char_zero_of_literature O) (_root_.UpperTheory.LiteratureTheorems.poincare_lelong_inv_of_literature O) PositivityTheory.Pf1.HilbertSamuelMoriwaki.hsUse_outright PositivityTheory.Pf1.HilbertSamuelMoriwaki.moriwakiBig_outright (_root_.UpperTheory.LiteratureTheorems.fargues_exact_of_literature O) (_root_.UpperTheory.LiteratureTheorems.zarhin_statement O) (_root_.UpperTheory.LiteratureTheorems.nef_rr_of_literature O) (_root_.UpperTheory.LiteratureTheorems.siegel_toroidal_integral_of_literature O) (_root_.UpperTheory.LiteratureTheorems.toroidal_for_fan_ks_of_literature O) (_root_.UpperTheory.LiteratureTheorems.semi_abelian_lie_seminegative_of_literature O) (_root_.UpperTheory.LiteratureTheorems.point_separation_pair_of_literature O) (_root_.UpperTheory.LiteratureTheorems.ar_degree_of_literature O) (_root_.UpperTheory.LiteratureTheorems.published_results_arithmetic O) (_root_.UpperTheory.LiteratureTheorems.grothendieck_deformation_of_literature O))
            have hL := local_langlands_gl_recT_exists_of_literature O
            have hHyps := UpperTheory.Lit.nonempty_hyps_definite_side_of_closed_bound
              P F hAM.1 hAM.2 hX hL
              (fun cDep => UpperTheory.N.boundAtTwoThree_linked_of_recT P.nLink
                (GlobalTheory.Mem.Top.Bl.parametersOfDependence hL cDep))
            have hG := GlobalTheory.GreenBridge.green_of_regular P.greenRegularCharacters
            exact hHyps.elim (fun h => GlobalTheory.Fc.forall_goal_of_shape_of_hyps _ _ _ _
              (UpperTheory.Top.shape_closed_link_n_of_green hG) trivial trivial h)
          
          theorem producer_topG : UpperTheory.Top.TopG := by
            have h := UpperTheory.Gal.Int.galoisLocalGlobalStrong_recParameter
            exact topG_of_literature ⟨h, UpperTheory.Zero.LLC.recTExists, h⟩
          
          #print axioms BorghettiRH.topG_of_literature
          #print axioms BorghettiRH.producer_topG
          end BorghettiRH
          end
          LEAN
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean")
          s = p.read_text(encoding="utf-8")
          marker = "theorem UpperTheory.LiteratureTheorems.every_character_of_literature_of_vWin "
          assert s.count(marker) == 1 and s.rstrip().endswith("end")
          prefix = s.split(marker)[0]
          terminal = "import Development.AutomorphicArithmetic.CharacterBoxes.RiemannHypothesisOfEveryCharacter\n"
          assert prefix.count(terminal) == 1
          prefix = prefix.replace(terminal, "")
          extra = "import Development.AutomorphicArithmetic.ThetaCorrespondence.ThetaPairLifts.ThirdPlaceSeries.TopShape\nimport Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.RecTExists\nimport Development.AutomorphicArithmetic.Foundations.GaloisRepresentations.IntegralStructures.RowSrc\n"
          p.write_text(extra + prefix + Path("RFHTopGBody.lean").read_text(), encoding="utf-8")
          PY
      - name: Producer | compile TopG preterminal extraction
        working-directory: upstream/lean
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          time lake build Development.AutomorphicArithmetic.ThetaCorrespondence.ThetaPairLifts.ThirdPlaceSeries.EveryCharacterOfLiteratureOfVWin 2>&1 | tee ../../bridge/assembly-logs/producer-topg.log
      - name: Producer | compile VWin and zeta instance
        working-directory: upstream/lean
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          time lake build Development.AutomorphicArithmetic.AutomorphicVarieties.ModularityArgument.ThresholdArguments.DenseThresholdCases.VwinOfRow Development.AutomorphicArithmetic.Foundations.GaloisRepresentations.IntegralStructures.RowSrc 2>&1 | tee ../../bridge/assembly-logs/producer-vwin-imports.log
          cat > RFHVWin.lean <<'LEAN'
          import Development.AutomorphicArithmetic.AutomorphicVarieties.ModularityArgument.ThresholdArguments.DenseThresholdCases.VwinOfRow
          import Development.AutomorphicArithmetic.Foundations.GaloisRepresentations.IntegralStructures.RowSrc
          
          namespace BorghettiRH
