          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          coeff_roots = [
              Path("Formalism/GradedWeylDivisibility/FockSpaceTableaux"),
              Path("Formalism/SatakeDualWeyl/AdelicIwasawaHecke"),
