                  s = s.replace("coeff (R := O) (σ := n) α _", "AddMonoidAlgebra.coeff (_ : MvPolynomial n O) α")
              s = re.sub(r"(?<![\w.])coeff(?![\w'])", "rhCompatCoeff", s)
              s = re.sub(r"(?<![\w.])coeff_zero(?![\w'])", "rhCompatCoeffZero", s)
              lines = s.splitlines(keepends=True)
