name: "B2 - actual Alpoge PNT bridge (h78 explicit)"
on:
  push:
    paths:
      - "B2PNTActualBridge.lean"
      - ".github/workflows/lean-b2-pnt-actual-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Install elan
        working-directory: alpoge
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Copy bridge sources
        run: |
          cp bridge/B2NoExceptional.lean alpoge/B2NoExceptional.lean
          cp bridge/B2PNTActualBridge.lean alpoge/B2PNTActualBridge.lean
      - name: Lake update
        working-directory: alpoge
        run: lake update
      - name: Fetch Mathlib cache
        working-directory: alpoge
        run: lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpoge-b2-0df444-${{ runner.os }}-
      - name: Build original PNT theorem
        working-directory: alpoge
        timeout-minutes: 270
        run: lake build Formalism.GL3MeanSquares.GenusMeanAsymptotics.JacobiCharacterSums.PNTFinal
      - name: Build B2NoExceptional module
        working-directory: alpoge
        run: lake env lean -o .lake/build/lib/lean/B2NoExceptional.olean B2NoExceptional.lean
      - name: Check actual PNT bridge and axioms
        working-directory: alpoge
        run: lake env lean B2PNTActualBridge.lean
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: |
            alpoge/.lake/build
            alpoge/.lake/packages/*/.lake/build
          key: alpoge-b2-0df444-${{ runner.os }}-${{ github.run_id }}
