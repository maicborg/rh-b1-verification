name: "B2 - prime above CRT modulus"
on:
  push:
    paths:
      - "B2PrimeAboveModulus.lean"
      - ".github/workflows/lean-b2-prime-above-modulus.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prime-modulus:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          filter: blob:none
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Copy lemma
        run: cp bridge/B2PrimeAboveModulus.lean alpoge/B2PrimeAboveModulus.lean
      - name: Lake update
        working-directory: alpoge
        run: lake update
      - name: Mathlib cache
        working-directory: alpoge
        run: lake exe cache get
      - name: Kernel check and print axioms
        working-directory: alpoge
        run: lake env lean B2PrimeAboveModulus.lean
