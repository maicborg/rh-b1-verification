      - name: Compile only repaired root
        working-directory: upstream/lean
        timeout-minutes: 9
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p ../../bridge/assembly-logs/micro-v14
          OUT="../../bridge/assembly-logs/micro-v14/1"
          echo "MICRO_START $TARGET"
          set +e
          timeout --kill-after=5s ${{ matrix.seconds }}s lake build "$TARGET" > "$OUT.log" 2>&1
          code=$?
          set -e
          case "$code" in
            0) status=green ;;
            124|137) status=timeout ;;
            *) status=failure ;;
          esac
          printf '%s\t%s\t%s\n' "$TARGET" "$status" "$code" > "$OUT.tsv"
          echo "MICRO_END $TARGET $status $code"
          tail -n 60 "$OUT.log"
      - name: Persist micro 1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfh-v14-${{ matrix.lot }}-micro-1-${{ github.run_id }}
          path: bridge/assembly-logs/micro-v14/1.*
          if-no-files-found: ignore
      - name: Save repaired root cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: upstream/lean/.lake/build
          key: rfh-root-retry-v14-4341-${{ runner.os }}-${{ matrix.lot }}-${{ github.run_id }}
      - name: Report root status
        if: always()
        working-directory: bridge
        shell: bash
        run: |
          set -euo pipefail
          cat assembly-logs/micro-v14/1.tsv
          awk -F '\t' '$2=="green"{ok=1} END{exit !ok}' assembly-logs/micro-v14/1.tsv
