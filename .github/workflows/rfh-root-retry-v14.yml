duct_mulVec_zero_iff v).mp ?_\n        rw [star_trivial]\n        exact heq.symm","        exact hPSD.dotProduct_mulVec_zero_iff.mp (by simpa only [star_trivial] using heq.symm)"],["Formalism/GL3MeanSquares/HookFormulaTorsion/HadamardUnitDiagonalDetLeOne.lean","Finset.prod_le_prod (fun i _ => hnn i)","Finset.prod_le_prod₀ (fun i _ => hnn i)"],["Formalism/GL3MeanSquares/HookFormulaTorsion/HadamardUnitDiagonalDetLeOne.lean","(hG.dotProduct_mulVec_zero_iff _).mp","hG.dotProduct_mulVec_zero_iff.mp"],["Formalism/GL3MeanSquares/HookFormulaTorsion/HadamardUnitDiagonalDetLeOne.lean","Finset.prod_le_one (fun c _ => hcol0 c)","Finset.prod_le_one₀ (fun c _ => hcol0 c)"],["Formalism/TameInertiaTowers/CentralOrderTwo/Groups.lean","Finset.prod_le_prod (fun _ _ => Nat.zero_le _) (fun i _ => hfin i)","Finset.prod_le_prod (fun i _ => hfin i)"],["Formalism/RealPlaceAnalysis/RealPlaceTaylor/ProdFactorialSupportSubSingle.lean","simp only [coeff_add]","simp only [AddMonoidAlgebra.coeff_add, Pi.add_apply]"],["Formalism/RealPlaceAnalysis/RealPlaceTaylor/ProdFactorialSupportSubSingle.lean","simp only [coeff_add, star_add]","simp only [AddMonoidAlgebra.coeff_add, Pi.add_apply, star_add]"],["Formalism/GradedWeylDivisibility/StatementC.lean","(coeff m g)","(g.coeff m)"]]
          for rel, old, new in patches:
