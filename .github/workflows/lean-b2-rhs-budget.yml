name: Lean B2 RH-S log budget
on:
  push:
    paths:
      - 'B2ThresholdSplitRHS.lean'
      - '.github/workflows/lean-b2-rhs-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: alpoge
          sparse-checkout: |
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            src
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Copy proof
        run: cp bridge/B2ThresholdSplitRHS.lean alpoge/B2ThresholdSplitRHS.lean
      - name: Dependencies
        working-directory: alpoge
        run: |
          lake update
          lake exe cache get
      - name: Kernel check and axioms
        working-directory: alpoge
        run: lake env lean B2ThresholdSplitRHS.lean
